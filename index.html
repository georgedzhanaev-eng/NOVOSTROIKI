var vyvIdx = 0, vyvAll = false;
/* высота слайда считается с учётом масштаба страницы (body.zoom) */
function vyvFit(){
  var body = document.getElementById('vyv-body');
  if(!body) return;
  var z = parseFloat(document.body.style.zoom) || 1;
  var win = window.innerHeight || 800;
  body.style.setProperty('--vyv-h', Math.max(240, (win - 150) / z).toFixed(0) + 'px');
  /* уточняем по фактическому положению картинки: низ должен остаться в окне */
  var img = body.querySelector('img');
  if(!img) return;
  var fix = function(n){
    var r = img.getBoundingClientRect();
    var extra = document.documentElement.scrollHeight - win;   // паддинги страницы
    var avail = (win - r.top - 12 - Math.max(0, extra)) / z;
    if(avail > 200) body.style.setProperty('--vyv-h', avail.toFixed(0) + 'px');
    /* повторяем, пока страница не перестанет прокручиваться */
    if(n < 3 && document.documentElement.scrollHeight - win > 2) fix(n + 1);
  };
  fix(0);
  if(!img.complete) img.addEventListener('load', function(){ fix(0); }, { once:true });
}
function renderVyv(){
  var body = document.getElementById('vyv-body');
  var img = function(i){ return '<img src="data:image/webp;base64,'+VYV[i]+'" alt="Слайд '+(i+1)+'">'; };
  body.className = vyvAll ? 'all' : '';
  body.innerHTML = vyvAll ? VYV.map(function(_, i){ return img(i); }).join('') : img(vyvIdx);
  document.getElementById('vyv-cnt').textContent = vyvAll ? VYV.length + ' слайдов' : (vyvIdx + 1) + ' / ' + VYV.length;
  document.getElementById('vyv-all').setAttribute('aria-pressed', vyvAll);
  if(!vyvAll){ vyvFit(); setTimeout(vyvFit, 60); }
}
document.getElementById('vyv-prev').addEventListener('click', function(){
  vyvAll = false; vyvIdx = (vyvIdx - 1 + VYV.length) % VYV.length; renderVyv();
});
document.getElementById('vyv-next').addEventListener('click', function(){
  vyvAll = false; vyvIdx = (vyvIdx + 1) % VYV.length; renderVyv();
});
document.getElementById('vyv-all').addEventListener('click', function(){ vyvAll = !vyvAll; renderVyv(); });
document.addEventListener('keydown', function(e){
  if(tab !== 'vyv' || vyvAll) return;
  if(e.key === 'ArrowLeft'){ vyvIdx = (vyvIdx - 1 + VYV.length) % VYV.length; renderVyv(); }
  if(e.key === 'ArrowRight'){ vyvIdx = (vyvIdx + 1) % VYV.length; renderVyv(); }
});

/* ═══ Вкладка «Остаток без 2-го жилья» ════════════════════════════
   Та же квартирография, но только по помещениям Одинцовского округа,
   которые в таблице дашборда стоят как остаток и без второго жилья. */
function kv2Rows(){
  return KVG_OVERLAY.filter(function(r){
    var x = splitAddr(r[0]); if(!x) return false;
    var ap = aptParts(r[1]); if(!ap) return false;
    for(var i=0;i<rows.length;i++){
      var lr = rows[i];
      if(norm(okrugName(lr)).indexOf('одинцов') < 0) continue;
      if(!isRemaining(lr) || hasSecond(lr)) continue;
      var lx = splitAddr(cell(lr,'addr')); if(!lx) continue;
      if(lx.street !== x.street || lx.house !== x.house) continue;
      var la = aptParts(cell(lr,'apt')); if(!la) continue;
      if(la.flat === ap.flat && la.rooms.slice().sort().join(',') === ap.rooms.slice().sort().join(',')) return true;
    }
    return false;
  });
}
function kv2Stats(list){
  var t = { all:list.length, eq:0, up:0, no:0, aRes:0, aNew:0, over:0, cost:0, rooms:{} };
  list.forEach(function(r){
    var k = r[2];
    var g = t.rooms[k] || (t.rooms[k] = { all:0, eq:0, up:0, no:0, aRes:0, aNew:0, over:0, cost:0 });
    g.all++;
    if(r[4] === ''){ t.no++; g.no++; return; }
    if(r[4] === r[2]){ t.eq++; g.eq++; } else { t.up++; g.up++; }
    t.aRes += r[3]; t.aNew += r[6]; t.over += r[8]; t.cost += r[7];
    g.aRes += r[3]; g.aNew += r[6]; g.over += r[8]; g.cost += r[7];
  });
  t.matched = t.eq + t.up;
  t.gp = t.aRes * GP_RATE;
  t.need = t.cost - t.gp;
  return t;
}
var kv2Detail = false, kv2Supply = false, kv2OnlyMatched = false;
function renderKv2(){
  if(!rows.length){
    document.getElementById('kv2-row1').innerHTML =
      '<div class="notice">Данные таблицы ещё не загрузились — откройте вкладку позже или нажмите «Обновить».</div>';
    ['kv2-row2','kv2-row3','kv2-row4','kv2-row5','kv2-row6'].forEach(function(id){ document.getElementById(id).innerHTML = ''; });
    return;
  }
  var list = kv2Rows(), t = kv2Stats(list), a = function(x){ return fmtArea.format(x); };
  var rub = function(x){ return fmtInt.format(Math.round(x)); };
  var keys = Object.keys(t.rooms).sort(function(x, y){ return x - y; });
  var byRooms = keys.map(function(k){ return k+'-комн. '+fmtInt.format(t.rooms[k].all); }).join(' · ');

  /* квартиры, подобранные этим помещениям — по комнатности */
  var sup = {};
  list.forEach(function(r){
    if(r[4] === '') return;
    var g = sup[r[4]] || (sup[r[4]] = { cnt:0, area:0, cost:0 });
    g.cnt++; g.area += r[6]; g.cost += r[7];
  });
  var sKeys = Object.keys(sup).sort(function(x, y){ return x - y; });
  var bySupply = sKeys.map(function(k){ return k+'-комн. '+fmtInt.format(sup[k].cnt); }).join(' · ');

  document.getElementById('kv2-row1').innerHTML =
    kvgTile('Расселяемые', fmtInt.format(t.all), 'помещений', byRooms, 'var(--c-buy)',
      ' id="kv2-res" role="button" tabindex="0" aria-pressed="'+kv2Detail+'" style="cursor:pointer;--tone:var(--c-buy)" title="Показать разбивку по комнатности"') +
    kvgTile('Предоставляемые', fmtInt.format(t.matched), 'квартир', bySupply || 'подобранных квартир нет', 'var(--c-cert)',
      ' id="kv2-sup" role="button" tabindex="0" aria-pressed="'+kv2Supply+'" style="cursor:pointer;--tone:var(--c-cert)" title="Показать разбивку по комнатности"') +
    kvgTile('Подобрано', fmtInt.format(t.matched), 'помещений',
      'равная комнатность '+fmtInt.format(t.eq)+' · с увеличением '+fmtInt.format(t.up)+' · не подобрано '+fmtInt.format(t.no), 'var(--c-agr)',
      ' id="kv2-mat" role="button" tabindex="0" aria-pressed="'+kv2OnlyMatched+'" style="cursor:pointer;--tone:var(--c-agr)" title="Оставить в таблице внизу только подобранные"');
  document.getElementById('kv2-row2').innerHTML =
    kvgTile('Площадь расселяемые', a(t.aRes), 'м²', 'по '+fmtInt.format(t.matched)+' подобранным помещениям', 'var(--c-buy)') +
    kvgTile('Площадь предоставляемые', a(t.aNew), 'м²', 'по '+fmtInt.format(t.matched)+' подобранным квартирам', 'var(--c-cert)') +
    kvgTile('Превышение', (t.over >= 0 ? '+' : '')+a(t.over), 'м²', '', 'var(--c-own)');
  document.getElementById('kv2-row3').innerHTML =
    kvgTile('Финансирование ГП', fmtMln(t.gp), '₽', a(t.aRes)+' м² × '+fmtInt.format(GP_RATE)+' ₽ = '+rub(t.gp)+' ₽', 'var(--c-agr)') +
    kvgTile('Стоимость квартир', fmtMln(t.cost), '₽', 'по '+fmtInt.format(t.matched)+' подобранным квартирам = '+rub(t.cost)+' ₽', 'var(--c-cert)') +
    kvgTile('Необходимое финансирование', fmtMln(t.need), '₽', 'стоимость квартир минус финансирование ГП = '+rub(t.need)+' ₽', 'var(--c-own)');

  function row(cells, cls){ return '<tr'+(cls ? ' class="'+cls+'"' : '')+'>' + cells.map(function(c, i){
      return '<td'+(i ? ' class="num"' : '')+'>'+c+'</td>'; }).join('') + '</tr>'; }
  function table(title, tone, head, body){
    return '<section class="panel kvg-table" style="--tone:'+tone+'">' +
      '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>'+title+'</div></div>' +
      '<div style="overflow-x:auto"><table><thead><tr>' + head.map(function(h, i){
          return '<th'+(i ? ' class="num"' : '')+'>'+h+'</th>'; }).join('') + '</tr></thead><tbody>' + body + '</tbody></table></div></section>';
  }

  /* таблица расселяемых по комнатности */
  var el4 = document.getElementById('kv2-row4');
  el4.hidden = !kv2Detail;
  el4.innerHTML = !kv2Detail ? '' : table('Расселяемые помещения по комнатности', 'var(--c-buy)',
    ['Кол-во комнат','Всего расселяемых','Подобрано: равная комнатность','Подобрано: увеличение комнатности',
     'Не подобрано','Площадь расселяемых, м²','Площадь предоставляемых, м²','Превышение площади, м²'],
    keys.map(function(k){
      var g = t.rooms[k];
      return row([k+'-комн.', fmtInt.format(g.all), fmtInt.format(g.eq), fmtInt.format(g.up), fmtInt.format(g.no),
                  a(g.aRes), a(g.aNew), a(g.over)]);
    }).join('') + row(['Итого', fmtInt.format(t.all), fmtInt.format(t.eq), fmtInt.format(t.up), fmtInt.format(t.no),
                       a(t.aRes), a(t.aNew), a(t.over)], 'tot'));

  /* таблица предоставляемых по комнатности */
  var el5 = document.getElementById('kv2-row5');
  el5.hidden = !kv2Supply;
  var sAll = sKeys.reduce(function(x, k){ return x + sup[k].cnt; }, 0);
  var sArea = sKeys.reduce(function(x, k){ return x + sup[k].area; }, 0);

var selRat = null;
/* 1 дом, 2 дома, 10 домов */
function houseWord(n){
  var a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return 'домов';
  if(b === 1) return 'дом';
  if(b >= 2 && b <= 4) return 'дома';
  return 'домов';
}
function ratTotals(){
  var t = { houses:RATING.length, all:0, res:0, dec:0, green:0, blue:0, hard:0, resHouses:0, decHouses:0, restHouses:0 };
  RATING.forEach(function(d){
    t.all += d[1]; t.res += d[2]; t.dec += d[4];
    if(d[1] === 0) t.resHouses++;                   // дома, расселённые полностью (цифр в файле нет)
    else if(d[1] - d[2] - d[4] <= 0) t.decHouses++; // решение закрывает остаток
    else t.restHouses++;                            // остаётся остаток
    if(ratHard(d)) t.hard++;
    else if(d[1] === 0) t.green++;
    else if(d[1] - d[2] - d[4] <= 0) t.blue++;
  });
  t.work = t.all - t.res - t.dec;
  return t;
}
/* Проблемные дома: в детализации есть суд, розыск, наследство, резиновая квартира или запрет */
function ratHard(d){ return /суд|розыск|наследств|резинов|запрет/i.test(String(d[5] || '')); }
/* зелёный — дом расселён полностью; синий — остаток ноль за счёт решений;
   красный — суд, розыск, наследство, запрет регистрационных действий, резиновая квартира */
function ratColor(d){
  if(ratHard(d)) return '#c0392b';
  if(d[1] === 0) return 'var(--c-agr)';
  if(d[1] - d[2] - d[4] <= 0) return 'var(--c-cert)';
  return 'var(--ink)';
}
/* Группа дома для плиток первой строки */
function ratGroup(d){
  if(d[1] === 0) return 'res';                        // расселён полностью
  if(d[1] - d[2] - d[4] <= 0) return 'dec';           // остаток закрыт решениями
  return 'rest';                                      // остаётся остаток
}
var ratFilter = null;
function ratTile(name, val, sub, tone, key){
  var on = key ? ratFilter === key : !ratFilter;
  return '<div class="tile" style="--tone:'+tone+';cursor:pointer" data-ratf="'+(key || '')+'"' +
    ' role="button" tabindex="0" aria-pressed="'+on+'" title="'+esc(sub)+'">' +
    '<div class="tile-head"><div class="tile-name">'+name+'</div></div>' +
    '<div class="tile-figs"><span class="fig num">'+fmtInt.format(val)+'</span><span class="fig-unit">'+houseWord(val)+'</span></div></div>';
}
function renderRatKpi(){
  var t = ratTotals();
  document.getElementById('rat-kpi').innerHTML =
    ratTile('Всего', t.houses, 'адресов в файле', 'var(--c-ten)', '') +
    ratTile('Расселено', t.resHouses, 'дома, расселённые полностью', 'var(--c-agr)', 'res') +
    ratTile('Решение найдено', t.decHouses, 'дома, где остаток равен нулю', 'var(--c-cert)', 'dec') +
    ratTile('Остаток', t.restHouses, 'дома, где остаток больше нуля', 'var(--c-buy)', 'rest');
}

function renderRatRows(){

      return (rb - ra) || (b.d[4] - a.d[4]) || (b.d[1] - a.d[1]);

    '<span class="d30-dots">' + [
      { c:'var(--c-agr)', n:houses.filter(function(o){ return ratColor(o.d) === 'var(--c-agr)'; }).length, t:'Расселен' },
      { c:'var(--c-cert)', n:houses.filter(function(o){ return ratColor(o.d) === 'var(--c-cert)'; }).length, t:'Решение найдено' },
      { c:'#c0392b', n:houses.filter(function(o){ return ratColor(o.d) === '#c0392b'; }).length,
        t:'Суд, розыск, наследство, запрет регистрационных действий, резиновая квартира' },
      { c:'var(--ink)', n:houses.filter(function(o){ return ratColor(o.d) === 'var(--ink)'; }).length, t:'Остаток без решения' }

    p2 = '<section class="panel" style="--tone:var(--c-cert)">' +
      '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>Детализация</div>' +

/* ═══ Карта вкладки «Рейтинг» ═══════════════════════════════════════
   Значок дома в цвете строки списка: зелёный — расселён, синий — остаток
   закрыт решениями, красный — суд, розыск, наследство, запрет, резиновая квартира. */
var ymapRat = null, mapRatGen = 0, cluRat = null, ratPm = {};
var ratCat = {};            // дом → точность геокодера
var ratGeoFilter = null;    // фильтр по точности (клик по сводке под картой)
function ratIcon(color){
  var svg = HOUSE_SVG.replace(/#a96a15/g, color);
  return { iconLayout:'default#image',
    iconImageHref:'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg),
    iconImageSize:[30,30], iconImageOffset:[-15,-26], hideIconOnBalloonOpen:false, balloonOffset:[0,-28],
    zIndex: color === '#c0392b' ? 720 : 700 };
}
var RAT_ICONS = { 'var(--c-agr)':ratIcon('#0e7361'), 'var(--c-cert)':ratIcon('#1b4d8f'),
                  '#c0392b':ratIcon('#c0392b'), 'var(--ink)':ratIcon('#0f1317') };
function ratBalloon(d, cat, coords){
  var rest = d[1] - d[2] - d[4];
  var lines = String(d[5] || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
  return '<div style="font-family:IBM Plex Sans,sans-serif;font-size:13px;line-height:1.5;min-width:240px">' +
    '<b>'+esc(fmtAddr(d[0]))+'</b><br>' +
    (d[1]
      ? 'Всего: <b>'+fmtInt.format(d[1])+'</b><br>' +
        'Расселено: <b style="color:#0e7361">'+fmtInt.format(d[2])+'</b><br>' +
        'Решение найдено: <b style="color:#1b4d8f">'+fmtInt.format(d[4])+'</b><br>' +
        'Остаток: <b style="color:#c0392b">'+fmtInt.format(rest > 0 ? rest : 0)+'</b>'
      : '<b style="color:#0e7361">Расселен в полном объёме</b>') +
    (lines.length ? '<hr style="border:none;border-top:1px solid #eee;margin:6px 0">' + lines.map(esc).join('<br>') : '') +
    (cat ? '<br><span style="color:#767d87">Точка на карте: '+GEO_CATS[cat].label.toLowerCase()+'</span>' : '') +
    '<br>' + panoBtn(coords) + '</div>';
}
function drawRat(){
  var note = document.getElementById('rat-map-note');
  if(typeof ymaps === 'undefined'){ note.textContent = 'Яндекс.Карты не загрузились: проверьте ключ и ограничение по домену'; return; }
  var gen = ++mapRatGen;
  ymaps.ready(function(){
    if(gen !== mapRatGen) return;
    if(!ymapRat){
      ymapRat = new ymaps.Map('map-rat', { center:[55.75,37.62], zoom:8, controls:['zoomControl','typeSelector','fullscreenControl'] },
                              { suppressMapOpenBlock:true });
    }
    ymapRat.geoObjects.removeAll();
    if(cluRat) cluRat.destroy();
    var col = cluRat = new OverlapLayer(ymapRat);
    ratPm = {}; ratCat = {};
    var cache = geoCache(), now = Date.now(), queue = [], shown = 0, taken = {}, miss = 0;
    /* на карте только те дома, что сейчас в списке: учитываются плитки первой строки */
    var list = RATING.map(function(d, i){ return { d:d, i:i }; })
      .filter(function(o){ return !ratFilter || ratGroup(o.d) === ratFilter; });
    var cats = {};
    function count(cat){ cats[cat] = (cats[cat] || 0) + 1; }
    function status(extra){
      note.textContent = 'На карте ' + fmtInt.format(shown) + ' из ' + fmtInt.format(list.length) + ' домов' +
        (extra ? ' · ' + extra : '');
    }
    function put(d, i, c, cat){
      var key = c[0].toFixed(5)+','+c[1].toFixed(5), k = taken[key] || 0;
      taken[key] = k + 1;
      var p = c;
      if(k){ var a = k * 2.4, dd = 0.00018 * Math.sqrt(k); p = [c[0] + dd*Math.cos(a), c[1] + dd*1.7*Math.sin(a)]; }
      var pm = new ymaps.Placemark(p, { balloonContent:ratBalloon(d, cat, p),
        hintContent:fmtAddr(d[0]), grp:'red' }, RAT_ICONS[ratColor(d)] || RAT_ICONS['var(--ink)']);
      col.add(pm); ratPm[i] = pm; ratCat[i] = cat; shown++; count(cat);
    }
    function fit(){ if(shown) try{ ymapRat.setBounds(col.getBounds(), { checkZoomRange:true, zoomMargin:40 }); }catch(e){} }
    list.forEach(function(o){
      var d = o.d, i = o.i;
      var m = MANUAL_COORDS[norm(d[0])];
      if(m){ put(d, i, m, 'manual'); return; }
      var e = cache[norm(d[0])];
      if(e && now - e.t < GEO_TTL && e.miss){ miss++; return; }
      if(e && e.c && e.p && now - e.t < GEO_TTL) put(d, i, e.c, geoCat(e.p, e.k)); else queue.push({ d:d, i:i });
    });
    renderRatRows();                 // в строках появляется точность точки
    fit(); status(queue.length ? 'поиск адресов: ' + queue.length : (miss ? 'не найдено: ' + miss : ''));
    (function next(){
      if(gen !== mapRatGen) return;
      if(!queue.length){ fit(); status(miss ? 'не найдено: ' + miss : ''); renderRatRows(); return; }
      if(!dayTake()){ fit(); status('суточный лимит геокодера исчерпан, остальные дома появятся завтра'); renderRatRows(); return; }
      var h = queue.shift();
      ymaps.geocode(h.d[0], { results:1, boundedBy:MO_BOUNDS, strictBounds:true }).then(function(res){
        var g = res.geoObjects.get(0), cc = geoCache();
        if(g){
          var c = g.geometry.getCoordinates();
          var prec = g.properties.get('metaDataProperty.GeocoderMetaData.precision') || 'other';
          var kind = g.properties.get('metaDataProperty.GeocoderMetaData.kind') || '';
          cc[norm(h.d[0])] = { c:c, t:Date.now(), p:prec, k:kind }; geoSave(cc);
          if(gen === mapRatGen) put(h.d, h.i, c, geoCat(prec, kind));
        } else {
          cc[norm(h.d[0])] = { miss:true, t:Date.now() }; geoSave(cc);
          miss++;
        }
        status('поиск адресов: ' + queue.length);
        setTimeout(next, 120);
      }, function(){ miss++; setTimeout(next, 300); });
    })();
  });
}
document.getElementById('rat-rows').addEventListener('click', function(e){
  var b = e.target.closest('[data-rat]'); if(!b) return;
  var i = +b.getAttribute('data-rat');
  selRat = (selRat === i) ? null : i;
  renderRatRows();
  if(selRat == null || !ymapRat) return;
  var pm = ratPm[selRat]; if(!pm) return;
  ymapRat.setCenter(pm.geometry.getCoordinates(), 16, { duration:300 });
  setTimeout(function(){
    var cp = cluRat && cluRat.clusterOf(pm);
    if(cp) cp.balloon.open(); else pm.balloon.open();
  }, 400);
});

function fmtMln(v){

  if(Math.abs(v) >= 1e6) return (v/1e6).toFixed(1).replace('.',',') + ' млн';

function kvgTotals(){
  var t = { all:0, eq:0, up:0, no:0, aRes:0, aNew:0, over:0, sAll:0, sUsed:0, sFree:0 };

  KVG.supply.forEach(function(r){ t.sAll += r[1]; t.sUsed += r[2]; t.sFree += r[3]; });
  t.matched = t.eq + t.up;
  t.cost = 0; KVG.rooms.forEach(function(r){ t.cost += r[8]; });      // стоимость подобранных квартир

/* Точность геокодера Яндекса (metaDataProperty.GeocoderMetaData):
   precision exact — дом найден точно; number / near / range — дом найден приблизительно;
   street — только улица; other — по kind: locality — населённый пункт,
   district — микрорайон / район города, area / province — район / область. */
var GEO_CATS = {
  house:    { label:'Точно до дома',             color:'#0e7361' },
  manual:   { label:'Уточнено вручную',          color:'#1b4d8f' },
  approx:   { label:'До дома приблизительно',    color:'#4f8a74' },
  street:   { label:'До улицы',                  color:'#a96a15' },
  district: { label:'До микрорайона',            color:'#c98a2b' },
  locality: { label:'До населённого пункта',     color:'#c0392b' },
  region:   { label:'До района или области',     color:'#7d1f16' },
  other:    { label:'Прочее',                    color:'#767d87' },
  miss:     { label:'Не найдено',                color:'#0f1317' },
  pending:  { label:'Ищется',                    color:'#c9ccd1' }
};
function geoCat(prec, kind){
  if(prec === 'exact') return 'house';
  if(prec === 'number' || prec === 'near' || prec === 'range') return 'approx';
  if(prec === 'street') return 'street';
  if(kind === 'locality') return 'locality';
  if(kind === 'district') return 'district';
  if(kind === 'area' || kind === 'province' || kind === 'country') return 'region';
  return 'other';
}

var houses30 = null, sel30 = null, sel30h = null, clu30 = null;

/* ═══ Вкладка «До 30%»: плитки, список домов, решения ═══════════════ */
function d30Totals(){
  var t = { houses:DO30_DATA.length, all:0, res:0, rest:0, dec:0 };
  t.decHouses = 0; t.workHouses = 0; t.green = 0; t.orange = 0; t.black = 0;
  DO30_DATA.forEach(function(d){
    t.all += d[1]; t.res += d[2]; t.rest += d[3]; t.dec += d[4];
    if(d[4] > 0) t.decHouses++;                       // домов, где решение найдено
    if(d[1] - d[2] - d[4] > 0) t.workHouses++;        // домов с остатком
    if(d[2] + d[4] === d[1]) t.green++;               // зелёные: расселено + решение = всего
    else if(d[4] > 0) t.orange++;                     // оранжевые: решение есть, но не на всё
    else t.black++;
  });
  t.done = t.res + t.dec;                 // расселено + решение найдено
  t.work = t.all - t.done;                // в работе
  return t;
}
function d30Tile(name, val, unit, sub, tone){

    '<div class="tile-head"><div class="tile-name">'+name+'</div></div>' +
    '<div class="tile-figs"><span class="fig num">'+fmtInt.format(val)+'</span><span class="fig-unit">'+unit+'</span></div></div>';
}
/* Плитка, где значение уже отформатировано (например, «98 / 47») */
function d30Tile2(name, val, unit, sub, tone){
  return '<div class="tile" style="--tone:'+tone+'" title="'+esc(sub)+'">' +
    '<div class="tile-head"><div class="tile-name">'+name+'</div></div>' +
    '<div class="tile-figs"><span class="fig num">'+val+'</span><span class="fig-unit">'+unit+'</span></div></div>';
}
function renderDo30Kpi(){
  var t = d30Totals();
  document.getElementById('d30-kpi').innerHTML =
    d30Tile('Дома', t.houses, 'домов', 'адресов в списке «До 30%»', 'var(--c-ten)') +
    d30Tile('Ж/п', t.all, 'помещений', 'всего в этих домах', 'var(--c-agr)') +
    d30Tile('Расселено', t.res, 'помещений', 'столбец «Расселено»', 'var(--c-agr)') +
    d30Tile('Решение найдено', t.dec, 'помещений', 'столбец «Решение найдено»', 'var(--c-cert)') +
    d30Tile2('Остаток', fmtInt.format(t.work) + ' / ' + fmtInt.format(t.houses - t.green), 'помещений / домов',
      'помещения: всего минус расселено и решение · дома: все минус зелёные', 'var(--c-buy)');
}
/* Цвет адреса: зелёный — расселено + решение = всего; оранжевый — решение есть,
   но до «всего» не хватает; иначе обычный цвет текста. */
/* Городской округ по старому названию города или района из адреса */
var OKRUG_MAP = {
  'балашиха':'Балашиха','бронницы':'Бронницы','домодедово':'Домодедово','егорьевск':'Егорьевск','егорьевский':'Егорьевск',
  'коломна':'Коломна','озерский':'Коломна','королев':'Королёв','красногорск':'Красногорск','красноармейск':'Красноармейск',
  'лыткарино':'Лыткарино','люберецкий':'Люберцы','орехово-зуево':'Орехово-Зуево','орехово-зуевский':'Орехово-Зуево',
  'подольск':'Подольск','рошаль':'Шатура','сергиев посад':'Сергиев Посад','сергиево-посадский':'Сергиев Посад',
  'серпухов':'Серпухов','серпуховский':'Серпухов','электрогорск':'Электрогорск','электросталь':'Электросталь',
  'волоколамский':'Волоколамский','воскресенский':'Воскресенск','дмитровский':'Дмитровский','зарайский':'Зарайск',
  'истринский':'Истра','клинский':'Клин','луховицкий':'Луховицы','можайский':'Можайский','мытищи':'Мытищи',
  'мытищинский':'Мытищи','наро-фоминский':'Наро-Фоминский','ногинский':'Богородский','павлово-посадский':'Павловский Посад',
  'пушкинский':'Пушкинский','раменский':'Раменский','рузский':'Рузский','свердловский':'Лосино-Петровский',
  'серебряно-прудский':'Серебряные Пруды','солнечногорский':'Солнечногорск','ступинский':'Ступино','талдомский':'Талдомский',
  'шатурский':'Шатура','шаховской':'Шаховская','щелковский':'Щёлково',
  /* города, записанные без района */
  'ногинск':'Богородский','электроугли':'Богородский','старая купавна':'Богородский','фрязево':'Богородский',
  'волоколамск':'Волоколамский','воскресенск':'Воскресенск','дмитров':'Дмитровский','дрезна':'Орехово-Зуево',
  'ликино-дулево':'Орехово-Зуево','куровское':'Орехово-Зуево','зарайск':'Зарайск','истра':'Истра','снегири':'Истра',
  'клин':'Клин','краснозаводск':'Сергиев Посад','можайск':'Можайский','озеры':'Коломна','павловский посад':'Павловский Посад',
  'пушкино':'Пушкинский','солнечногорск':'Солнечногорск','талдом':'Талдомский','вербилки':'Талдомский',
  'щелково':'Щёлково','люберцы':'Люберцы','октябрьский':'Люберцы','лыткарино':'Лыткарино','красноармейск':'Красноармейск'
};
function okrugOf(addr){
  /* берём исходный адрес: там есть район, который fmtAddr убирает */
  var raw = String(addr||'').replace(/^\s*обл\.?\s*московская\s*,\s*/i, '');
  var first = raw.split(',')[0].trim();
  var core = norm(first).replace(/^(г|гп|рп|пгт|дп|п|с|д|р-н)\.?\s*/, '');
  return OKRUG_MAP[core] || first.replace(/^(г|гп|рп|пгт|дп|п|с|д|р-н)\.\s*/i, '');
}
function d30Color(d){
  if(d[2] + d[4] === d[1]) return 'var(--c-agr)';
  if(d[4] > 0) return '#d17a1b';
  return 'var(--ink)';
}
function renderDo30Rows(){
  var t = d30Totals();
  var houses = DO30_DATA.map(function(d, i){ return { d:d, i:i }; })
    /* по городским округам (первая часть адреса), внутри округа: зелёные, оранжевые, чёрные,
       далее по остатку в процентах */
    .sort(function(a,b){
      var okr = function(d){ return okrugOf(d[0]); };
      var rank = function(d){ return d[2] + d[4] === d[1] ? 0 : (d[4] > 0 ? 1 : 2); };
      return okr(a.d).localeCompare(okr(b.d), 'ru') || (rank(a.d) - rank(b.d)) || (b.d[5]-a.d[5]) || (b.d[3]-a.d[3]);
    });
  var lastOkr = '';
  var rowsHtml = houses.map(function(o){
    var d = o.d, sel = sel30h === o.i;
    var head = '';
    var ok = okrugOf(d[0]);
    if(ok !== lastOkr){ lastOkr = ok; head = '<div class="d30-okr">'+esc(ok)+'</div>'; }
    return head + '<button class="item" type="button" data-d30="'+o.i+'" aria-pressed="'+sel+'">' +
      '<span class="item-rank num">'+(houses.indexOf(o)+1)+'</span>' +
      '<span class="item-name" style="color:'+d30Color(d)+'" title="'+esc(fmtAddr(d[0]))+'">'+esc(fmtAddr(d[0]))+'</span>' +
      '<span class="item-cnt num" style="font-size:13px">'+fmtInt.format(d[1])+'</span>' +
      '<span class="num" style="color:var(--c-agr);font-weight:600">'+fmtInt.format(d[2])+'</span>' +
      '<span class="num" style="color:var(--c-cert);font-weight:600">'+(d[4] ? fmtInt.format(d[4]) : '—')+'</span>' +
      '<span class="num" style="color:var(--c-buy);font-weight:600">'+fmtInt.format(d[3])+'</span></button>';
  }).join('');
  var p1 = '<section class="panel" style="--tone:#c0392b">' +
    '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>Список домов</div>' +
    '<span class="panel-cnt">'+fmtInt.format(houses.length)+'</span>' +
    '<span class="d30-dots">' +
      '<span title="Решение найдено по всем ж/п"><i style="background:var(--c-agr)"></i>'+fmtInt.format(t.green)+'</span>' +
      '<span title="Решение найдено не по всему остатку"><i style="background:#d17a1b"></i>'+fmtInt.format(t.orange)+'</span>' +
      '<span title="Решение по остатку пока не найдено"><i style="background:var(--ink)"></i>'+fmtInt.format(t.black)+'</span></span></div>' +
    '<div class="scroll" id="d30-houses">' +
    '<div class="d30-head"><span></span><span>Адрес</span><span>Всего</span><span>Расселено</span><span>Решение найдено</span><span>Остаток</span></div>' +
    rowsHtml + '</div></section>';

  var p2;
  if(sel30h != null && DO30_DATA[sel30h]){
    var d = DO30_DATA[sel30h];
    var lines = String(d[6] || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
    p2 = '<section class="panel" style="--tone:var(--c-cert)">' +
      '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>Детализация</div>' +
      '<span class="panel-cnt">'+fmtInt.format(d[4])+'</span>' +
      '<span class="cnt-legend">'+esc(fmtAddr(d[0]))+'</span></div>' +
      '<div class="scroll" id="d30-detail">' +
      (lines.length ? lines.map(function(x, i){
          var tr = termOf(d[0]);
          return '<div class="item"><span class="item-rank num">'+(i+1)+'</span>' +
            '<span class="item-name wrap">'+esc(x)+'</span>' +
            '<span class="item-term">'+(tr ? 'срок: '+esc(tr) : '')+'</span></div>';
        }).join('') : '<div class="empty">По этому дому детализации в таблице нет.</div>') +
      '</div></section>';
  } else {
    p2 = '<section class="panel" style="--tone:var(--c-cert)">' +
      '<div class="panel-head"><div class="panel-title"><span class="swatch"></span>Детализация</div></div>' +
      '<div class="scroll"><div class="empty">Выберите дом в списке слева — здесь появится детализация решений.</div></div></section>';
  }
  var prevList = document.getElementById('d30-houses');
  var topList = prevList ? prevList.scrollTop : 0;
  document.getElementById('d30-rows').innerHTML = p1 + p2;
  var nowList = document.getElementById('d30-houses');
  if(nowList) nowList.scrollTop = topList;
}
function renderDo30(){ renderDo30Kpi(); renderDo30Rows(); }

/* Клик по дому: детализация справа и переход к дому на карте */
document.getElementById('d30-rows').addEventListener('click', function(e){
  var b = e.target.closest('[data-d30]'); if(!b) return;
  var i = +b.getAttribute('data-d30');
  sel30h = (sel30h === i) ? null : i;
  renderDo30Rows();
  /* дом показывается на карте, но страница не прокручивается */
  if(sel30h == null || !houses30 || !ymap30) return;
  var h = houses30[sel30h]; if(!h || !h.pm) return;
  ymap30.setCenter(h.pm.geometry.getCoordinates(), 16, { duration:300 });
  setTimeout(function(){
    var cp = clu30 && clu30.clusterOf(h.pm);
    if(cp) cp.balloon.open(); else h.pm.balloon.open();
  }, 400);
});

function drawDo30(){
  renderDo30();
  var note = document.getElementById('map30-note');
  if(typeof ymaps === 'undefined'){ note.textContent = 'Яндекс.Карты не загрузились: проверьте ключ и ограничение по домену'; return; }
  var gen = ++map30Gen;
  houses30 = DO30_DATA.map(function(d, i){ return { d:d, i:i, cat:'pending', pm:null }; });
  ymaps.ready(function(){
    if(gen !== map30Gen) return;
    if(!ymap30){
      ymap30 = new ymaps.Map('map30', { center:[55.75,37.62], zoom:8, controls:['zoomControl','typeSelector','fullscreenControl'] },
                             { suppressMapOpenBlock:true });
    }
    ymap30.geoObjects.removeAll();
    if(clu30) clu30.destroy();
    var col = clu30 = new OverlapLayer(ymap30);
    var cache = geoCache(), now = Date.now(), queue = [], shown = 0, taken = {};

    function put(h, c, cat){
      var key = c[0].toFixed(5)+','+c[1].toFixed(5), k = taken[key] || 0;
      taken[key] = k + 1;
      var p = c, d = h.d;
      if(k){ var a = k * 2.4, dd = 0.00018 * Math.sqrt(k); p = [c[0] + dd*Math.cos(a), c[1] + dd*1.7*Math.sin(a)]; }
      h.cat = cat;
      h.pm = new ymaps.Placemark(p, { balloonContent:balloon30(d, cat, p),
        hintContent:fmtAddr(d[0]) + ' · остаток ' + d[3] + ' из ' + d[1], grp:'red' }, HOUSE_ICON_RED);
      col.add(h.pm);
      shown++;
    }
    function fit(){ if(shown) try{ ymap30.setBounds(col.getBounds(), { checkZoomRange:true, zoomMargin:40 }); }catch(e){} }
    function status(extra){
      note.textContent = 'На карте ' + fmtInt.format(shown) + ' из ' + fmtInt.format(DO30_DATA.length) + ' домов' + (extra ? ' · ' + extra : '');
    }
    houses30.forEach(function(h){
      var m = MANUAL_COORDS[norm(h.d[0])];
      if(m){ put(h, m, 'manual'); return; }
      var e = cache[norm(h.d[0])];
      if(e && now - e.t < GEO_TTL && e.miss){ h.cat = 'miss'; return; }
      if(e && e.c && e.p && now - e.t < GEO_TTL) put(h, e.c, geoCat(e.p, e.k)); else queue.push(h);
    });
    fit(); status(queue.length ? 'поиск адресов: ' + queue.length : '');
    (function next(){
      if(gen !== map30Gen) return;
      if(!queue.length){ fit(); status(''); return; }
      if(!dayTake()){ fit(); status('суточный лимит геокодера исчерпан, остальные дома появятся завтра'); return; }
      var h = queue.shift();
      ymaps.geocode(h.d[0], { results:1, boundedBy:MO_BOUNDS, strictBounds:true }).then(function(res){
        var g = res.geoObjects.get(0), cc = geoCache();
        if(g){
          var c = g.geometry.getCoordinates();
          var prec = g.properties.get('metaDataProperty.GeocoderMetaData.precision') || 'other';
          var kind = g.properties.get('metaDataProperty.GeocoderMetaData.kind') || '';
          cc[norm(h.d[0])] = { c:c, t:Date.now(), p:prec, k:kind }; geoSave(cc);
          if(gen === map30Gen) put(h, c, geoCat(prec, kind));
        } else {
          cc[norm(h.d[0])] = { miss:true, t:Date.now() }; geoSave(cc);
          h.cat = 'miss';
        }
        status('поиск адресов: ' + queue.length);
        setTimeout(next, 120);
      }, function(){ h.cat = 'miss'; setTimeout(next, 300); });
    })();
  });
}
var mapBtns = document.querySelectorAll('[data-mapf]');
for(var mb=0;mb<mapBtns.length;mb++){
  mapBtns[mb].addEventListener('click', function(){
    var f = this.getAttribute('data-mapf');
    mapFilter = (mapFilter === f) ? null : f;
    for(var q=0;q<mapBtns.length;q++) mapBtns[q].setAttribute('aria-pressed', mapBtns[q].getAttribute('data-mapf') === mapFilter ? 'true' : 'false');
    if(rows.length) drawMap();
  });
}
document.getElementById('btn-spots').addEventListener('click', function(){
  spotsOn = !spotsOn;
  this.setAttribute('aria-pressed', spotsOn ? 'true' : 'false');
  if(rows.length) drawMap();
});
document.getElementById('nav-map').addEventListener('click', function(){ switchTo(tab === 'map' ? 'main' : 'map'); });

load();
