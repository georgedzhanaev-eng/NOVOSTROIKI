<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Переселение из АЖФ в Новостройки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://api-maps.yandex.ru/2.1/?apikey=904e9ba6-8848-4b42-a871-82002e05c23a&lang=ru_RU"></script>
<style>
:root{
  --bg:#eceee9;
  --surface:#ffffff;
  --surface-2:#f6f7f4;
  --ink:#0f1317;
  --ink-2:#454c55;
  --muted:#767d87;
  --hair:rgba(15,19,23,.12);
  --hair-soft:rgba(15,19,23,.07);
  --track:rgba(15,19,23,.08);
  --c-agr:#0e7361;
  --c-cert:#1b4d8f;
  --c-buy:#a96a15;
  --c-ten:#4a5a6e;
  --c-own:#6c4a86;
  --focus:#1b4d8f;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;text-align:left}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

.ctrl{
  border:1px solid var(--hair);background:var(--surface);
  border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500;
  transition:border-color .15s,background .15s;
}
.ctrl:hover{border-color:var(--ink-2)}
.ctrl[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

#tools{position:fixed;top:14px;left:14px;z-index:30;display:flex;gap:8px}
#tabs{position:fixed;top:14px;right:14px;z-index:30;display:flex;gap:8px}
#view-map{padding-top:40px;display:flex;flex-direction:column;gap:24px}
#map,#map30{height:calc(100vh - 170px);min-height:480px;border-radius:0 0 14px 14px;overflow:hidden}
#geo-modal{position:fixed;inset:0;z-index:60;background:rgba(15,19,23,.45);display:flex;align-items:center;justify-content:center;padding:20px}
#geo-modal[hidden]{display:none!important}
.geo-box{background:var(--surface);border-radius:14px;width:min(1000px,96vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
#geo-text{flex:1;min-height:50vh;margin:10px 18px 18px;border:1px solid var(--hair);border-radius:8px;padding:10px;
  font:12px/1.5 ui-monospace,Consolas,monospace;resize:none;white-space:pre;overflow:auto;background:var(--surface-2);color:var(--ink)}
.geo-exp{margin-left:8px}
#view-do30{padding-top:40px;display:flex;flex-direction:column;gap:24px}
#map30-note{margin-left:auto;font-size:12px;color:var(--muted)}
.geo-sum{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--hair-soft)}
.geo-chip{cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--hair);border-radius:8px;background:var(--surface-2);font-size:12px;color:var(--ink-2)}
.geo-chip b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.geo-chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.geo-chip:hover{border-color:var(--ink-2)}
.geo-chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.geo-chip[aria-pressed="true"] b{color:var(--surface)}
.geo-list .item{grid-template-columns:28px minmax(0,1fr) 170px 64px}
.geo-list .item-cat{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.geo-list .item-cat i{width:9px;height:9px;border-radius:2px;flex:none}
.geo-list .scroll{max-height:520px}
@media(max-width:640px){.geo-list .item{grid-template-columns:24px minmax(0,1fr) 56px}.geo-list .item-cat{display:none}}
#map-note{margin-left:auto;font-size:12px;color:var(--muted)}
.map-legend{display:flex;gap:8px}
.map-legend .ctrl{padding:5px 10px;font-size:12px;border-radius:7px;display:flex;align-items:center;gap:6px}
.map-legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.map-clu{width:34px;height:34px;border-radius:50%;color:#fff;font:700 14px/1 'IBM Plex Sans',sans-serif;display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);transform:translate(-50%,-50%);cursor:pointer}
@keyframes spotGlow{0%,100%{filter:drop-shadow(0 0 2px #3fa9ff) drop-shadow(0 0 4px #3fa9ff)}50%{filter:drop-shadow(0 0 7px #8fd0ff) drop-shadow(0 0 14px #1e7bff) brightness(1.3)}}
@keyframes spotTwinkle{0%,100%{opacity:.2;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
.spot-ico{position:absolute;left:-15px;top:-26px;width:30px;height:30px;animation:spotGlow 1.3s ease-in-out infinite}
.spot-ico img{display:block;width:30px;height:30px}
.spot-ico::after{content:'✦';position:absolute;right:-7px;top:-9px;color:#bfe6ff;font-size:13px;text-shadow:0 0 4px #1e7bff;animation:spotTwinkle 1.3s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.spot-ico,.spot-ico::after{animation:none}}
.dist-label{background:#1e8a4c;color:#fff;font:600 12px/1 'IBM Plex Sans',sans-serif;padding:4px 7px;border-radius:6px;
  white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.25);transform:translate(-50%,-50%);display:inline-block}
@media(max-width:640px){#map,#map30{height:420px;min-height:0}}
#to-top{position:fixed;right:18px;bottom:18px;z-index:30;width:44px;height:44px;padding:0;
  border-radius:50%;font-size:18px;line-height:1;box-shadow:0 6px 18px rgba(15,19,23,.14)}
[hidden]{display:none!important}
#view-main{display:flex;flex-direction:column;gap:24px}

main{padding:16px 28px 32px;display:flex;flex-direction:column;gap:24px;max-width:1720px}
.row-lead{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.row-lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.row-lead.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.row-lead.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.row-lead.four{grid-template-columns:repeat(4,minmax(0,1fr))}

/* ── округа: первая строка ─────────────────────────── */
.okr-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.okr-card{width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:14px;
  padding:26px 18px 22px;position:relative;overflow:hidden;text-align:center;
  transition:border-color .15s,box-shadow .15s}
.okr-card::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:3px;background:var(--tone)}
.okr-card:hover{border-color:var(--tone)}
.okr-card[aria-pressed="true"]{border-color:var(--tone);box-shadow:0 0 0 2px var(--tone) inset}
.okr-name{display:block;font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.okr-card .tile-area{margin-top:14px;text-align:left}

/* ── заголовок ─────────────────────────────────────── */
.plan{display:flex;flex-direction:column;align-items:center;gap:18px}
.plan-title{font-size:22px;font-weight:700;letter-spacing:.01em;text-align:center;text-transform:uppercase}

/* ── плитки ────────────────────────────────────────── */
.tile{
  width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:14px;
  padding:18px 18px 16px;display:flex;flex-direction:column;gap:14px;
  position:relative;overflow:hidden;transition:border-color .15s,box-shadow .15s;
}
.tile::before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:3px;background:var(--tone)}
.tile:hover{border-color:var(--tone)}
.tile[aria-pressed="true"]{border-color:var(--tone);box-shadow:0 0 0 2px var(--tone) inset}
.tile-head{display:flex;align-items:flex-start;gap:12px}
.tile-name{font-size:13px;font-weight:600;letter-spacing:-.005em;flex:1}
.ring{flex:none}
.ring text{font-size:11px;font-weight:600;fill:var(--ink);font-family:inherit}
.tile-figs{display:flex;align-items:baseline;gap:10px}
.fig{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.fig-unit{font-size:13px;color:var(--muted);font-weight:500}
.tile-area{font-size:14px;color:var(--ink-2);font-weight:500;display:flex;justify-content:space-between;gap:8px;
  border-top:1px solid var(--hair-soft);padding-top:10px}
.tile-miss{font-size:12px;color:var(--muted);border-top:1px solid var(--hair-soft);padding-top:10px}
.tile-area span:first-child{color:var(--muted);font-size:12px;font-weight:400;align-self:center}

/* ── панели со списками ────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--hair);border-radius:14px;display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 18px 14px;border-bottom:1px solid var(--hair-soft)}
.panel-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.swatch{width:9px;height:9px;border-radius:2px;background:var(--tone);flex:none}
.sortgroup{display:flex;gap:6px}
.sortgroup .ctrl{padding:5px 10px;font-size:12px;border-radius:7px}
.scroll{overflow-y:auto;max-height:420px;padding:8px 8px 12px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--track);border-radius:99px}
.item{width:100%;display:grid;grid-template-columns:22px minmax(96px,1.1fr) minmax(60px,2fr) 52px 84px;
  align-items:center;gap:10px;padding:9px 10px;border-radius:9px;transition:background .15s,box-shadow .15s}
.item:nth-child(odd){background:var(--surface-2)}
.item:hover{background:var(--track)}
.item[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--tone) inset}
.item-rank{font-size:11px;color:var(--muted);text-align:right}
.item-name{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--tone);width:0;transition:width .4s ease}
.item-cnt{font-size:14px;font-weight:600;text-align:right}
.item-area{font-size:12px;color:var(--ink-2);text-align:right}
.item-name.wrap{white-space:normal;overflow:visible;line-height:1.35;overflow-wrap:anywhere}
#scroll-newAddr .item.jkd{grid-template-columns:22px minmax(0,1.7fr) minmax(40px,1fr) 72px 104px;cursor:default}
#scroll-newAddr .item.jkd:hover{background:inherit}
.jk-from{margin-left:auto;font-size:11px;color:var(--muted);max-width:55%;text-align:right;line-height:1.35}
.jk-from b{color:var(--ink-2);font-weight:600}
#scroll-house .item{grid-template-columns:22px minmax(140px,2.4fr) minmax(40px,.7fr) 112px 84px}
.cnt3{white-space:nowrap}
.cnt3 .c-res{color:var(--c-agr)}
.cnt3 .c-rest{color:var(--c-buy)}
.cnt3 .sl{color:var(--muted);font-weight:400;margin:0 2px}
.cnt-legend{margin-left:auto;font-size:11px;color:var(--muted)}
.cnt-legend b{font-weight:600}
.item.do30{--tone:#c0392b}
.item.do30 .item-name{color:#c0392b;font-weight:600}
.item.do30 .addr-okrug{color:#c0392b;opacity:.75}
.addr-okrug{display:block;font-size:10.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.panel-cnt{font-size:15px;font-weight:700;color:var(--tone);margin-left:4px;font-variant-numeric:tabular-nums}
.empty{padding:28px 16px;color:var(--muted);font-size:13px}

/* ── фильтры ───────────────────────────────────────── */
.filters{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:14px 18px}
.filters label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.filters select{
  font:inherit;font-size:13px;font-weight:500;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--hair);border-radius:8px;padding:8px 12px;max-width:260px;cursor:pointer}

.notice{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:22px;font-size:13px;color:var(--ink-2);line-height:1.6}
.notice h2{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px}
.notice ol{margin:8px 0 14px 18px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:1180px){
  .row-lead,.row-lead.three{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row-lists{grid-template-columns:1fr}
  .okr-row,.row-lead.four{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .plan-title{font-size:18px}
}
@media (max-width:640px){
  main{padding:56px 14px 24px;gap:16px}
  .row-lead,.row-lead.two,.row-lead.three,.row-lead.four,.okr-row{grid-template-columns:1fr}
  .okr-name{font-size:24px}
  .fig{font-size:30px}
  .item{grid-template-columns:20px minmax(80px,1fr) 46px 76px;gap:8px}
  .item .bar{display:none}
}
</style>
</head>
<body>

<div id="tools">
  <button class="ctrl" id="reset" type="button">Сбросить</button>
  <button class="ctrl" id="reload" type="button">Обновить</button>
</div>
<div id="tabs">
  <button class="ctrl" id="nav-do30" type="button" aria-pressed="false">До 30%</button>
  <button class="ctrl" id="nav-map" type="button" aria-pressed="false">Карта</button>
</div>
<button class="ctrl" id="to-top" type="button" hidden aria-label="Наверх" title="Наверх">↑</button>

<main>
<div id="view-main">
  <section class="plan" aria-label="Заголовок">
    <div class="plan-title">Переселение из АЖФ в Новостройки</div>
  </section>

  <section class="okr-row" id="row-okr" aria-label="Округа"></section>
  <section class="row-lead three" id="row-sum" aria-label="Всего, расселено, остаток"></section>
  <section class="row-lead four" id="row-str" aria-label="Дома, жилые помещения, собственники, наниматели"></section>
  <section class="row-lead two" id="row-sec" aria-label="Второе жильё"></section>
  <section class="row-lists" id="row-addr" aria-label="Адреса"></section>
</div>

<div id="view-do30" hidden>
  <section class="panel" style="--tone:#c0392b">
    <div class="panel-head"><div class="panel-title"><span class="swatch"></span>Дома с остатком до 30%</div>
      <button class="ctrl geo-exp" type="button" data-geoexp="1" style="padding:5px 10px;font-size:12px">Выгрузить координаты</button>
      <span id="map30-note"></span></div>
    <div id="map30"></div>
  </section>
  <section class="panel geo-list" style="--tone:#c0392b">
    <div class="panel-head"><div class="panel-title"><span class="swatch"></span><span id="list30-title">Список домов</span></div>
      <span class="panel-cnt" id="list30-cnt"></span></div>
    <div class="scroll" id="list30"></div>
  </section>
</div>

<div id="view-map" hidden>
  <section class="panel" style="--tone:var(--c-buy)">
    <div class="panel-head"><div class="panel-title"><span class="swatch"></span>Аварийные дома</div>
      <button class="ctrl geo-exp" type="button" data-geoexp="1" style="padding:5px 10px;font-size:12px">Выгрузить координаты</button>
      <div class="map-legend" role="group" aria-label="Какие дома показать">
        <button class="ctrl" type="button" data-mapf="red" aria-pressed="false"><i style="background:#c0392b"></i>Остаток до 30%</button>
        <button class="ctrl" type="button" data-mapf="other" aria-pressed="false"><i style="background:#a96a15"></i>Остальные дома</button>
        <button class="ctrl" type="button" data-mapf="jk" aria-pressed="false"><i style="background:#1e8a4c"></i>Новостройки (ЖК)</button>
        <button class="ctrl" type="button" id="btn-spots" aria-pressed="false"><i style="background:#1e7bff"></i>Пятна застройки</button></div>
      <span id="map-note"></span></div>
    <div id="map"></div>
  </section>
</div>

  <div id="notice"></div>
</main>

<div id="geo-modal" hidden role="dialog" aria-modal="true" aria-labelledby="geo-modal-title">
  <div class="geo-box">
    <div class="panel-head"><div class="panel-title" id="geo-modal-title">Координаты из кэша</div>
      <span id="geo-modal-cnt" style="font-size:12px;color:var(--muted)"></span>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="ctrl" type="button" id="geo-copy">Скопировать</button>
        <button class="ctrl" type="button" id="geo-close" aria-label="Закрыть">✕</button></div></div>
    <p style="font-size:12px;color:var(--ink-2);padding:10px 18px 0">Скопируйте текст целиком и пришлите в чат — координаты будут встроены в дашборд.</p>
    <textarea id="geo-text" readonly spellcheck="false"></textarea>
  </div>
</div>

<script>
(function(){
"use strict";

/* ═══ 1. Источник данных ══════════════════════════════════════════════
   Таблица «Ликвидация аварийного жилья», вкладка «Для Дашборда/ГИН».
   Столбцы находятся по заголовкам: Округ, Населенный пункт, Адрес МКД,
   Номер ж/п, Тип собст-ти, Площадь, Статус, Название ЖК, Комнатность,
   Площадь ж/п в ЖК.                                                    */
var SHEET_ID = '1Cknhc3pac1ICkfUtxAX1e2FhTF8LpYqfoCuBfDYthaY';
var GID      = '1042951315';
/* Ссылка «Опубликовать в интернете» на вкладку в формате CSV.
   Нужна, если к таблице закрыт доступ по ссылке. Пусто — не используется. */
var PUB_CSV  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRenAtjnIK6_kE_rsQva52qyI7Z28Eb_tpIkWQA_6-lNfa_DNbjomx8LlaNo8_47t37aGUAB1Yr5OyB/pub?gid=1042951315&single=true&output=csv';

function sources(){
  var t = Date.now();
  var csv  = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/export?format=csv&gid='+GID+'&_='+t;
  var gviz = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=0&gid='+GID+'&_='+t;
  var direct = [{ name:'Google gviz (скрипт)', jsonp:true }];
  if(PUB_CSV) direct.push({ name:'Опубликованный CSV', url:PUB_CSV + (PUB_CSV.indexOf('?')>=0 ? '&' : '?') + '_=' + t });
  direct.push({ name:'Google gviz', url:gviz }, { name:'Google export', url:csv });
  return {
    direct: direct,
    proxy: [
      { name:'Прокси allorigins', url:'https://api.allorigins.win/raw?url='+encodeURIComponent(csv) },
      { name:'Прокси codetabs',   url:'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(csv) },
      { name:'Прокси corsproxy',  url:'https://corsproxy.io/?url='+encodeURIComponent(csv) }
    ]
  };
}

/* ═══ 2. Нормализация ════════════════════════════════════════════════ */
function norm(v){ return String(v==null?'':v).replace(/\u00a0/g,' ').replace(/ё/gi,'е').replace(/\s+/g,' ').trim().toLowerCase(); }
function clean(v){ var s = String(v==null?'':v).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim(); return /^[-–—]$/.test(s) ? '' : s; }
function num(v){
  /* Первое число в ячейке: «45,6 м2» → 45.6, «1 234,5 кв.м» → 1234.5 */
  var s = String(v==null?'':v).replace(/[\u00a0\u202f]/g,' ').replace(/(\d)\s+(?=\d)/g,'$1');
  var m = s.match(/-?\d+(?:[.,]\d+)*/);
  if(!m) return 0;
  var t = m[0];
  if(t.indexOf(',')>-1 && t.indexOf('.')>-1) t = t.replace(/,/g,'');
  else t = t.replace(',','.');
  var x = parseFloat(t);
  return isFinite(x) ? x : 0;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

var fmtInt  = new Intl.NumberFormat('ru-RU');
var fmtArea = new Intl.NumberFormat('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1});

/* Номера столбцов определяются по строке заголовков. */
var COL = null;
function detectCols(head){
  var h = (head||[]).map(norm);
  function find(p){ for(var i=0;i<h.length;i++) if(h[i] && p(h[i])) return i; return -1; }
  return {
    okrug:  find(function(s){ return s.indexOf('округ')>=0; }),
    np:     find(function(s){ return s.indexOf('населен')>=0; }),
    addr:   find(function(s){ return s.indexOf('адрес')>=0; }),
    apt:    find(function(s){ return s.indexOf('номер')>=0; }),
    tenure: find(function(s){ return s.indexOf('собст')>=0; }),
    area:   6,                              // площадь — всегда столбец G
    newAddr: 11,                            // адрес предоставляемый — столбец L
    status: find(function(s){ return s.indexOf('статус')>=0; }),
    jk:     find(function(s){ return s.indexOf('жк')>=0 && s.indexOf('площад')<0; }),
    rooms:  find(function(s){ return s.indexOf('комнат')>=0; }),
    jkArea: find(function(s){ return s.indexOf('площад')>=0 && s.indexOf('жк')>=0; }),
    second: find(function(s){ return s.indexOf('второ')>=0; })
  };
}
function cell(r, k){ return COL && COL[k] >= 0 ? clean(r[COL[k]]) : ''; }

function okrugName(r){ return cell(r,'okrug'); }
function areaOf(r){ return num(cell(r,'area')); }
function jkAreaOf(r){ return num(cell(r,'jkArea')); }
function statusOf(r){ return cell(r,'status') || 'Не указан'; }
function tenureOf(r){ return cell(r,'tenure') || 'Не указан'; }
function jkOf(r){ return cell(r,'jk'); }
function newAddrOf(r){ return cell(r,'newAddr'); }
function roomsOf(r){
  var s = norm(cell(r,'rooms'));
  if(!s) return 'Не указано';
  if(s.indexOf('студ')>=0) return 'Студия';
  var m = s.match(/(\d+)/);
  return m ? m[1]+'-комн.' : cell(r,'rooms');
}
function roomsOrder(v){ if(v==='Студия') return 0; var m=/^(\d+)-комн/.exec(v); return m ? +m[1] : (v==='Не указано' ? 1000 : 999); }

/* ═══ 3. Показатели ══════════════════════════════════════════════════
   Расселено — статус «Расселено».
   Остаток — статус «Подлежит расселению».
   Собственники — «Частная», наниматели — «Муниципальная» (столбец «Тип собст-ти»).              */
function isResettled(r){
  var s = norm(cell(r,'status'));
  return s.indexOf('расселен') === 0;               // «Расселено»
}
function isRemaining(r){
  return norm(cell(r,'status')).indexOf('подлежит') === 0;   // «Подлежит расселению»
}
/* Тип собст-ти: «Частная» — собственники, «Муниципальная» — наниматели. */
function isOwner(r){ var s = norm(tenureOf(r)); return s.indexOf('частн')>=0 || s.indexOf('собственник')>=0; }
function isTenant(r){ var s = norm(tenureOf(r)); return s.indexOf('муницип')>=0 || s.indexOf('наним')>=0; }
/* Единый формат адреса для показа: «г. Одинцово, ш. Буденновское, д. 11».
   Убирается «обл. Московская» и «р-н. …» (если после него есть город); если город не указан, подставляется округ;
   пробелы и «д.46» → «д. 46» выравниваются. На сопоставление и координаты не влияет. */
function fmtAddr(raw, okrug){
  var s = String(raw==null?'':raw).replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();
  s = s.replace(/^(обл\.?\s*московская|московская\s+обл(\.|асть)?)\s*,\s*/i, '');
  s = s.replace(/(^|,\s*)р-н\.?\s*[^,]*,\s*(?=г\.\s)/i, '$1');   // «р-н.» убирается, если дальше указан город
  s = s.replace(/\s*,\s*/g, ', ').replace(/(^|[\s,])(д|дом)\.(?=\d)/g, '$1$2. ').replace(/^,\s*/, '');
  if(okrug && !/^г\.\s/i.test(s)){
    var city = String(okrug).trim();
    if(norm(s).indexOf(norm(city)) !== 0) s = 'г. ' + city + ', ' + s;
  }
  return s;
}
function houseOf(r){ return norm(okrugName(r))+'|'+norm(cell(r,'np'))+'|'+norm(cell(r,'addr')); }
function always(){ return true; }

var OKRS = [
  { key:'d1', title:'Одинцовский', stem:'одинцов' },
  { key:'d2', title:'Красногорск', stem:'красногорск' },
  { key:'d3', title:'Химки',       stem:'химки' },
  { key:'d4', title:'Домодедово',  stem:'домодедов' }
];

var SUM = [
  { key:'all',  name:'Всего',     tone:'var(--c-agr)',  slot:'res', val:null,  test:always },
  { key:'res',  name:'Расселено', tone:'var(--c-cert)', slot:'res', val:'yes', test:isResettled },
  { key:'rest', name:'Остаток',   tone:'var(--c-buy)',  slot:'res', val:'no',  test:isRemaining }
];
/* Второе жильё: столбец с заголовком «Второе жильё».
   «Да» / «Есть» — есть второе жильё, остальное (в т.ч. пусто) — нет. */
function hasSecond(r){ var s = norm(cell(r,'second')); return s.indexOf('да')===0 || s.indexOf('есть')===0; }
var SEC = [
  { key:'sec-yes', name:'Есть второе жильё', tone:'var(--c-own)', slot:'second', val:'yes', test:hasSecond, needCol:'second' },
  { key:'sec-no',  name:'Нет второго жилья', tone:'var(--c-cert)', slot:'second', val:'no',  test:function(r){ return !hasSecond(r); }, needCol:'second' }
];
var STR = [
  { key:'houses', name:'Дома',         tone:'var(--c-ten)',  slot:'tenKind', val:null,  test:always, houses:true },
  { key:'apt',    name:'Ж/п',          tone:'var(--c-agr)',  slot:'tenKind', val:null,  test:always },
  { key:'own',    name:'Собственники', tone:'var(--c-own)',  slot:'tenKind', val:'own', test:isOwner },
  { key:'ten',    name:'Наниматели',   tone:'var(--c-ten)',  slot:'tenKind', val:'ten', test:isTenant }
];

/* ═══ 4. Состояние ═══════════════════════════════════════════════════ */
var rows = [], view = [];
var state = { okrug:null, status:null, tenure:null, jk:null, rooms:null, res:null, tenKind:null, second:null, house:null, newAddr:null };
var scrollKeep = {};

function passFilters(r, skipArg){
  var sk = [].concat(skipArg||[]);
  function no(k){ return sk.indexOf(k) < 0; }
  if(state.okrug  && no('okrug')  && norm(okrugName(r)) !== state.okrug) return false;
  if(state.status && no('status') && norm(statusOf(r)) !== state.status) return false;
  if(state.tenure && no('tenure') && norm(tenureOf(r)) !== state.tenure) return false;
  if(state.jk     && no('jk')     && norm(jkOf(r)) !== state.jk) return false;
  if(state.rooms  && no('rooms')  && roomsOf(r) !== state.rooms) return false;
  if(state.res    && no('res')     && !(state.res === 'yes' ? isResettled(r) : isRemaining(r))) return false;
  if(state.tenKind && no('tenKind') && !(state.tenKind === 'own' ? isOwner(r) : isTenant(r))) return false;
  if(state.second && no('second') && (state.second === 'yes') !== hasSecond(r)) return false;
  if(state.house  && no('house')   && houseOf(r) !== state.house) return false;
  if(state.newAddr && no('newAddr') && norm(newAddrOf(r)) !== state.newAddr) return false;
  return true;
}
function buildView(){ view = rows.filter(function(r){ return passFilters(r); }); }

/* ═══ 5. Загрузка ════════════════════════════════════════════════════ */
/* Разбор CSV без внешних библиотек (кавычки, "" внутри кавычек, переносы строк).
   Внешний PapaParse убран: cdnjs в рабочей сети не открывается. */
function parseCSV(t){
  t = String(t||'').replace(/^\uFEFF/,'');
  var R = [], r = [], c = '', q = false;
  for(var i=0;i<t.length;i++){
    var ch = t[i], nx = t[i+1];
    if(q){
      if(ch === '"' && nx === '"'){ c += '"'; i++; }
      else if(ch === '"') q = false;
      else c += ch;
    } else {
      if(ch === '"') q = true;
      else if(ch === ','){ r.push(c); c = ''; }
      else if(ch === '\r'){ /* пропуск */ }
      else if(ch === '\n'){ r.push(c); R.push(r); r = []; c = ''; }
      else c += ch;
    }
  }
  if(c !== '' || r.length){ r.push(c); R.push(r); }
  return R.filter(function(row){ return row.some(function(x){ return String(x).trim() !== ''; }); });
}

/* Загрузка одного канала. В журнал пишется, что именно вернул канал —
   это выводится на экран, если данные не получены ни одним способом. */
var loadLog = [];
function parseOne(src, ms){
  if(src.jsonp) return parseJsonp(src, ms);
  return new Promise(function(resolve){
    var done = false, ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    function fin(data, msg){ if(done) return; done = true; clearTimeout(timer); loadLog.push({ name:src.name, msg:msg }); resolve(data); }
    var timer = setTimeout(function(){ if(ctl) ctl.abort(); fin(null, 'нет ответа за ' + Math.round(ms/1000) + ' с'); }, ms);
    fetch(src.url, { cache:'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function(resp){
        if(!resp.ok){ fin(null, 'ошибка HTTP ' + resp.status); return; }
        return resp.text().then(function(text){
          var head = text.replace(/^\uFEFF/,'').slice(0,200).toLowerCase();
          if(head.indexOf('<!doctype')>=0 || head.indexOf('<html')>=0){
            fin(null, 'вместо таблицы пришла веб-страница (обычно — страница входа Google: доступ к таблице закрыт)'); return;
          }
          var data = parseCSV(text);
          if(!data.length){ fin(null, 'пустой ответ'); return; }
          var x = extract(data);
          fin(data, x ? ('получено строк: ' + x.rows.length) : 'в ответе нет заголовков «Округ» и «Адрес МКД»');
        });
      })
      .catch(function(){ fin(null, 'запрос заблокирован (сеть или CORS)'); });
  });
}

/* Канал без CORS: Google Visualization отдаёт данные как скрипт (JSONP).
   Работает, когда таблица открыта по ссылке или опубликована в интернете.
   Ячейки берутся в отображаемом виде (f), иначе — значение (v). */
function parseJsonp(src, ms){
  return new Promise(function(resolve){
    var done = false, cb = '__ginGviz' + Date.now() + Math.floor(Math.random()*1000);
    var el = document.createElement('script');
    function fin(data, msg){
      if(done) return; done = true; clearTimeout(timer);
      loadLog.push({ name:src.name, msg:msg });
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(el.parentNode) el.parentNode.removeChild(el);
      resolve(data);
    }
    var timer = setTimeout(function(){ fin(null, 'нет ответа за ' + Math.round(ms/1000) + ' с'); }, ms);
    window[cb] = function(resp){
      if(!resp || resp.status === 'error' || !resp.table){
        var e = resp && resp.errors && resp.errors[0];
        fin(null, 'Google ответил ошибкой' + (e ? ': ' + (e.detailed_message || e.message || e.reason) : ''));
        return;
      }
      var t = resp.table, cols = t.cols || [];
      var data = [cols.map(function(c){ return c && c.label ? c.label : ''; })];
      (t.rows || []).forEach(function(r){
        data.push(cols.map(function(c, i){
          var x = r.c && r.c[i];
          if(!x) return '';
          if(x.f != null) return String(x.f);
          return x.v == null ? '' : String(x.v);
        }));
      });
      var x = extract(data);
      fin(data, x ? ('получено строк: ' + x.rows.length) : 'в ответе нет заголовков «Округ» и «Адрес»');
    };
    el.onerror = function(){ fin(null, 'скрипт Google не загрузился (сеть)'); };
    el.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?gid=' + GID +
      '&headers=1&tqx=out:json;responseHandler:' + cb + '&_=' + Date.now();
    document.head.appendChild(el);
  });
}

/* Строка заголовков и строки с данными. null — в ответе нет заголовков. */
function extract(data){
  for(var i=0;i<Math.min(20,data.length);i++){
    var c = detectCols(data[i]);
    if(c.okrug >= 0 && c.addr >= 0){
      var out = [];
      for(var j=i+1;j<data.length;j++){
        var r = data[j];
        if(!r) continue;
        var ok = clean(r[c.okrug]), ad = clean(r[c.addr]);
        if(!ok && !ad) continue;
        if(norm(ok).indexOf('итог')===0 || norm(ok).indexOf('всего')===0) continue;
        out.push(r);
      }
      return { cols:c, rows:out };
    }
  }
  return null;
}

var loadGen = 0;

function load(){
  var gen = ++loadGen;
  skeleton();
  document.getElementById('notice').innerHTML = '';

  var src = sources(), got = null;
  loadLog = [];

  function apply(data){
    if(gen !== loadGen || !data) return;
    var x = extract(data);
    if(x && (!got || x.rows.length > got.rows.length)) got = x;
  }
  function stage(list){
    return Promise.all(list.map(function(u){ return parseOne(u, 25000).then(apply); }));
  }

  stage(src.direct).then(function(){
    if(gen !== loadGen) return;
    if(got) return;
    return stage(src.proxy);
  }).then(function(){
    if(gen !== loadGen) return;
    if(!got){ failure(); return; }
    COL = got.cols; rows = got.rows;
    if(!rows.length){ emptySheet(); return; }
    render();
  });
}

function skeleton(){
  function cells(n){
    var h = '';
    for(var i=0;i<n;i++){
      h += '<div class="tile" style="--tone:var(--track);opacity:.45">' +
        '<div class="tile-head"><div class="tile-name">—</div></div>' +
        '<div class="tile-figs"><span class="fig num">—</span></div>' +
        '<div class="tile-area"><span>Площадь</span><span class="num">—</span></div></div>';
    }
    return h;
  }
  document.getElementById('row-okr').innerHTML = '';
  document.getElementById('row-sum').innerHTML = cells(3);
  document.getElementById('row-sec').innerHTML = cells(2);
  document.getElementById('row-str').innerHTML = cells(4);
  document.getElementById('row-addr').innerHTML = '';
}

function clearMain(){
  ['row-okr','row-sum','row-sec','row-str','row-addr'].forEach(function(id){ document.getElementById(id).innerHTML = ''; });
}

function failure(){
  clearMain();
  var log = loadLog.map(function(l){ return '<li><b>'+esc(l.name)+'</b>: '+esc(l.msg)+'</li>'; }).join('');
  document.getElementById('notice').innerHTML =
    '<div class="notice"><h2>Таблица не отдала данные</h2>' +
    'Что ответил каждый канал:<ul style="margin:8px 0 14px 18px">' + log + '</ul>' +
    'Что проверить:' +
    '<ol><li>У таблицы включён доступ «Все, у кого есть ссылка» — «Читатель», либо вкладка опубликована как CSV и ссылка вставлена в PUB_CSV.</li>' +
    '<li>Вкладка «Для Дашборда/ГИН» существует и её gid — ' + GID + '.</li>' +
    '<li>Страница открыта по http(s). При открытии файла с диска (адрес file://) браузер блокирует запрос к Google.</li></ol>' +
    '<button class="ctrl" type="button" onclick="location.reload()">Загрузить заново</button></div>';
}

function emptySheet(){
  clearMain();
  document.getElementById('notice').innerHTML =
    '<div class="notice"><h2>На вкладке нет строк с данными</h2>' +
    'Заголовки вкладки «Для Дашборда/ГИН» найдены, но под ними пусто. Заполните столбцы «Округ» и «Адрес МКД» и нажмите «Обновить».</div>';
}

/* ═══ 6. Отрисовка ═══════════════════════════════════════════════════ */
function ring(pct, tone){
  var r = 22, c = 2 * Math.PI * r, on = c * Math.max(0, Math.min(1, pct));
  return '<svg class="ring" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">' +
    '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="6"/>' +
    '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="' + tone + '" stroke-width="6" stroke-linecap="round"' +
    ' stroke-dasharray="' + on.toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 28 28)"/>' +
    '<text x="28" y="32" text-anchor="middle">' + Math.round(pct * 100) + '%</text></svg>';
}

function snapScroll(){
  var boxes = document.querySelectorAll('.scroll');
  for(var i=0;i<boxes.length;i++) if(boxes[i].id) scrollKeep[boxes[i].id] = boxes[i].scrollTop;
}
function restoreScroll(){
  var boxes = document.querySelectorAll('.scroll');
  for(var i=0;i<boxes.length;i++) if(boxes[i].id && scrollKeep[boxes[i].id]) boxes[i].scrollTop = scrollKeep[boxes[i].id];
}

function render(){
  if(tab === 'map') drawMap();
  snapScroll();
  buildView();
  renderTiles();
  renderAddr();
  restoreScroll();
}

/* Ключ округа для фильтра: самое частое написание в таблице. */
function okrId(stem){
  var cnt = {}, best = null;
  rows.forEach(function(r){ var id = norm(okrugName(r)); if(id.indexOf(stem) >= 0) cnt[id] = (cnt[id]||0) + 1; });
  for(var id in cnt) if(!best || cnt[id] > cnt[best]) best = id;
  return best;
}

function renderTiles(){
  /* Строка 1 — округа: только название */
  document.getElementById('row-okr').innerHTML = OKRS.map(function(o){
    var id = okrId(o.stem), area = 0;
    rows.forEach(function(r){
      if(norm(okrugName(r)).indexOf(o.stem) >= 0 && passFilters(r, 'okrug')) area += areaOf(r);
    });
    return '<button class="okr-card" type="button" data-okrcard="'+o.stem+'" aria-pressed="'+(!!id && state.okrug===id)+'" style="--tone:var(--c-cert)">' +
      '<span class="okr-name">'+o.title+'</span>' +
      '<div class="tile-area"><span>Площадь</span><span class="num">'+fmtArea.format(area)+' м²</span></div></button>';
  }).join('');

  /* Плитки строки считаются по выборке без фильтра своей же строки:
     при выборе «Расселено» плитки «Всего» и «Остаток» не обнуляются.
     Кольцо — доля от «Всего» / «Ж/п» (от «Дома» для домов). */
  function tile(m){
    if(m.needCol && !(COL && COL[m.needCol] >= 0)){
      return '<div class="tile" style="--tone:'+m.tone+'">' +
        '<div class="tile-head"><div class="tile-name">'+m.name+'</div></div>' +
        '<div class="tile-figs"><span class="fig num">—</span></div>' +
        '<div class="tile-miss">В таблице нет столбца «Второе жильё»</div></div>';
    }
    var baseRows = rows.filter(function(r){ return passFilters(r, m.slot); });
    var cnt = 0, area = 0, houses = {}, dh = {};
    for(var i=0;i<baseRows.length;i++){
      var r = baseRows[i];
      if(m.houses) dh[houseOf(r)] = 1;
      if(!m.test(r)) continue;
      cnt++; area += areaOf(r); houses[houseOf(r)] = 1;
    }
    var fig = cnt, denom = baseRows.length, unit = 'помещений';
    if(m.houses){ fig = Object.keys(houses).length; denom = Object.keys(dh).length; unit = 'домов'; }
    var share = denom ? fig/denom : 0;
    var on = m.val ? state[m.slot] === m.val : !state[m.slot];
    return '<button class="tile" type="button" data-tile="'+m.key+'" aria-pressed="'+(on?'true':'false')+'" style="--tone:'+m.tone+'">' +
      '<div class="tile-head"><div class="tile-name">'+m.name+'</div>' + ring(share, m.tone) + '</div>' +
      '<div class="tile-figs"><span class="fig num">'+fmtInt.format(fig)+'</span><span class="fig-unit">'+unit+'</span></div>' +
      '<div class="tile-area"><span>Площадь</span><span class="num">'+fmtArea.format(area)+' м²</span></div></button>';
  }

  /* Всего/расселено/остаток; второе жильё; дома/ж/п/собственники/наниматели */
  document.getElementById('row-sum').innerHTML = SUM.map(tile).join('');
  document.getElementById('row-sec').innerHTML = SEC.map(tile).join('');
  document.getElementById('row-str').innerHTML = STR.map(tile).join('');

  var cards = document.querySelectorAll('[data-okrcard]');
  for(var c=0;c<cards.length;c++){
    cards[c].addEventListener('click', function(){
      var id = okrId(this.getAttribute('data-okrcard'));
      if(!id) return;
      state.okrug = (state.okrug === id) ? null : id;
      render();
    });
  }
  var tiles = document.querySelectorAll('[data-tile]');
  for(var t=0;t<tiles.length;t++){
    tiles[t].addEventListener('click', function(){
      var k = this.getAttribute('data-tile'), m = null;
      SUM.concat(SEC, STR).forEach(function(x){ if(x.key === k) m = x; });
      if(!m) return;
      state[m.slot] = (!m.val || state[m.slot] === m.val) ? null : m.val;
      render();
    });
  }
}

/* ═══ 7. Адреса ════════════════════════════════════════════════════
   Адрес аварийный — «Адрес МКД» (столбец D), группировка по дому.
   Адрес предоставляемый — столбец L.
   Площадь — столбец G. Клик по строке фильтрует дашборд.            */
function addrPanel(key, title, tone, list){
  var max = list.length ? list[0].cnt : 1;
  var rowsHtml = list.length ? list.map(function(o,i){
      var w = max > 0 ? Math.max(2, Math.round(o.cnt/max*100)) : 0;
      return '<button class="item'+(o.red ? ' do30' : '')+'" type="button"'+(o.red ? ' title="В списке «До 30%»"' : '')+' data-addr="'+key+'" data-id="'+esc(o.id)+'" aria-pressed="'+(state[key]===o.id)+'">' +

        '<span class="item-name wrap">'+(o.sub ? '<span class="addr-okrug">'+esc(o.sub)+'</span>' : '')+esc(o.name)+'</span>' +
        '<span class="bar"><i style="width:'+w+'%"></i></span>' +
        (key === 'house'
          ? '<span class="item-cnt num cnt3" title="Всего ж/п: '+o.cnt+' · расселено: '+o.res+' · подлежит расселению: '+o.rest+'">'+
              fmtInt.format(o.cnt)+'<span class="sl">/</span><span class="c-res">'+fmtInt.format(o.res)+'</span><span class="sl">/</span><span class="c-rest">'+fmtInt.format(o.rest)+'</span></span>'

function collect(key, idFn, nameFn, subFn){
  var agg = {}, order = [];
  rows.forEach(function(r){
    if(!passFilters(r, key)) return;
    var name = nameFn(r); if(!name) return;
    var id = idFn(r);
    if(!agg[id]){
      agg[id] = { id:id, name:name, sub:subFn ? subFn(r) : '', cnt:0, area:0, res:0, rest:0,
                  red: key === 'house' && isDo30({ np:cell(r,'np'), addr:cell(r,'addr') }) };
      order.push(id);
    }
    agg[id].cnt++; agg[id].area += areaOf(r);
    if(isResettled(r)) agg[id].res++;
    if(isRemaining(r)) agg[id].rest++;
  });
  return order.map(function(id){ return agg[id]; })
    .sort(function(a,b){ return (b.cnt-a.cnt) || (b.area-a.area) || a.name.localeCompare(b.name,'ru'); });
}

/* Выбран дом в «Адрес аварийный» → в «Адрес предоставляемый» ЖК его округа
   с расстоянием по прямой от дома (координаты дома — встроенные / из кэша). */
function distM(a, b){
  var R = 6371000, t = Math.PI/180, dLa = (b[0]-a[0])*t, dLo = (b[1]-a[1])*t;
  var x = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function jkPanel(houseId){
  var r = null;
  for(var i=0;i<rows.length;i++) if(houseOf(rows[i]) === houseId){ r = rows[i]; break; }

  };
  if(!r) return head(0, '') + '<div class="scroll"><div class="empty">Дом не найден.</div></div></section>';
  var h = { okrug:okrugName(r), np:cell(r,'np'), addr:cell(r,'addr') };
  var geo = findGeo(h, geoCache()), from = geo && geo.c;
  var key = okrKey(h.okrug);
  var list = JK_DATA.filter(function(j){ return okrKey(j[0]) === key; }).map(function(j){
    return { j:j, d: from ? distM(from, [j[5], j[6]]) : null };
  });
  list.sort(function(a,b){ return (a.d==null ? 1e12 : a.d) - (b.d==null ? 1e12 : b.d) || a.j[1].localeCompare(b.j[1],'ru'); });
  var fromTxt = 'ЖК округа <b>'+esc(h.okrug)+'</b> · расстояние по прямой от <b>'+esc(fmtAddr(h.addr, h.okrug))+'</b>' +

  var max = 0; list.forEach(function(o){ if(o.d != null && o.d > max) max = o.d; });
  var body = list.length ? list.map(function(o, i){
      var w = (o.d != null && max > 0) ? Math.max(2, Math.round(o.d/max*100)) : 0;
      return '<div class="item jkd">' +
        '<span class="item-rank num">'+(i+1)+'</span>' +
        '<span class="item-name wrap">'+(o.j[4] ? '<span class="addr-okrug">'+esc(o.j[4])+'</span>' : '')+'ЖК «'+esc(o.j[1])+'»</span>' +

        '<span class="item-area num" title="Остаток площади в ЖК">'+fmtArea.format(o.j[7])+' м²</span></div>';
    }).join('') : '<div class="empty">В округе нет ЖК из таблицы новостроек.</div>';
  return head(list.length, fromTxt) + '<div class="scroll" id="scroll-newAddr">'+body+'</div></section>';
}

OverlapLayer.prototype.getBounds = function(filter){
  var pts = this.items.filter(function(p){ return !filter || filter(p); }).map(function(p){ return p.geometry.getCoordinates(); });

};
OverlapLayer.prototype.clusterOf = function(pm){ var i = this.items.indexOf(pm); return i >= 0 ? this.owner[i] : null; };
OverlapLayer.prototype.render = function(){
  var map = this.map, items = this.items, n = items.length, self = this;
  this.col.removeAll(); this.owner = [];
  if(!n) return;
  var zoom = map.getZoom(), proj = map.options.get('projection');
  var px = items.map(function(p){ return proj.toGlobalPixels(p.geometry.getCoordinates(), zoom); });
  /* объединение наложившихся значков (union-find) */
  var par = []; for(var i=0;i<n;i++) par[i] = i;
  function f(x){ while(par[x] !== x){ par[x] = par[par[x]]; x = par[x]; } return x; }
  for(var a=0;a<n;a++) for(var b=a+1;b<n;b++){
    if(Math.abs(px[a][0]-px[b][0]) < OVERLAP_PX && Math.abs(px[a][1]-px[b][1]) < OVERLAP_PX){ var ra = f(a), rb = f(b); if(ra !== rb) par[ra] = rb; }
  }
  var groups = {};
  for(var k=0;k<n;k++){ var r = f(k); (groups[r] = groups[r] || []).push(k); }
  Object.keys(groups).forEach(function(r){
    var g = groups[r];
    if(g.length === 1){ self.col.add(items[g[0]]); self.owner[g[0]] = null; return; }
    var red = 0, house = 0, jk = 0, lat = 0, lon = 0, names = [];
    g.forEach(function(i){
      var p = items[i], c = p.geometry.getCoordinates(), grp = p.properties.get('grp');
      lat += c[0]; lon += c[1];
      if(grp === 'red') red++; else if(grp === 'jk') jk++; else house++;
      names.push('<li>' + esc(String(p.properties.get('hintContent') || '')) + '</li>');
    });
    var color = red ? CLU_COLORS.red : (jk && !house ? CLU_COLORS.jk : (jk ? CLU_COLORS.mix : CLU_COLORS.house));
    var parts = [];
    if(red) parts.push(red + ' до 30%');
    if(house) parts.push(house + ' ' + (house === 1 ? 'дом' : 'домов'));
    if(jk) parts.push(jk + ' ЖК');
    var cp = new ymaps.Placemark([lat/g.length, lon/g.length], {
        n:g.length, color:color, hintContent:parts.join(' · ') + ' — нажмите, чтобы приблизить',
        balloonContent:'<div style="font-family:IBM Plex Sans,sans-serif;font-size:13px;line-height:1.5"><b>'+parts.join(' · ')+'</b><ul style="margin:6px 0 0 18px">'+names.join('')+'</ul></div>'
      }, { iconLayout:self.Layout, iconShape:{ type:'Circle', coordinates:[0,0], radius:18 }, zIndex:900, openBalloonOnClick:false });
    cp.events.add('click', function(){
      var pts = g.map(function(i){ return items[i].geometry.getCoordinates(); });
      var maxZ = 19;
      try{ maxZ = map.zoomRange.getCurrent()[1]; }catch(e){}
      if(map.getZoom() >= maxZ - 1) cp.balloon.open();
      else map.setBounds(ymaps.util.bounds.fromPoints(pts), { checkZoomRange:true, zoomMargin:90, duration:300 });
    });
    self.col.add(cp);
    g.forEach(function(i){ self.owner[i] = cp; });
  });
};

function addrWords(part){
  return norm(part).replace(/[«»"()]/g,' ').split(/[\s.]+/).filter(function(w){ return w && !ADDR_TYPES.test(w); }).join(' ');
}
function houseNo(part){ return norm(part).replace(/^(д|дом)\.?\s*/,'').replace(/\s+/g,'').replace(/^№/,''); }
/* Улица и номер дома: номер — последняя часть «д. N», улица — часть перед ней. */
function splitAddr(str){
  var parts = String(str||'').split(',').map(function(x){ return x.trim(); }).filter(Boolean);
  var hi = -1;
  for(var i=parts.length-1;i>=0;i--){ if(/^(д|дом)\.?\s*\d/i.test(norm(parts[i]))){ hi = i; break; } }
  if(hi < 0) return null;
  /* слова улицы сортируются: «ул. 2-я Вокзальная» = «ул. Вокзальная 2-я» */
  return { street: hi > 0 ? addrWords(parts[hi-1]).split(' ').sort().join(' ') : '', house: houseNo(parts[hi]) };
}

function isDo30(h){
  var x = splitAddr(h.addr); if(!x) return false;
  var list = do30Index()[x.street + '|' + x.house]; if(!list) return false;
  /* населённый пункт: из столбца «Населённый пункт» (допускается обрезанное написание,
     «мкр. Барыбин» = «мкр. Барыбино») или из частей самого адреса до улицы */
  var places = [];
  var np = addrWords(h.np); if(np) places.push(np);
  var parts = String(h.addr||'').split(',');
  parts.slice(0, Math.max(0, parts.length - 2)).forEach(function(p){ var w = addrWords(p); if(w && w !== 'московская') places.push(w); });

  });
}

function geoCache(){
  var c = {};
  try{ c = JSON.parse(localStorage.getItem(GEO_KEY)) || {}; }catch(e){ c = {}; }
  var t = GEO_SEED_DATE ? Date.parse(GEO_SEED_DATE) : 0;
  if(t){
    for(var k in GEO_SEED){
      var e = c[k], v = GEO_SEED[k];
      if(!e || (!e.c && !e.miss) || e.t < t) c[k] = { c:[v[0], v[1]], p:v[2] || 'other', k:v[3] || '', t:t };
    }
  }
  return c;
}
/* Выгрузка кэша: одна строка на адрес — ключ<TAB>широта<TAB>долгота<TAB>точность<TAB>вид */
function geoExportText(){
  var c = geoCache(), lines = [];
  Object.keys(c).sort().forEach(function(k){
    var e = c[k]; if(!e || !e.c) return;
    lines.push([k, e.c[0].toFixed(6), e.c[1].toFixed(6), e.p || '', e.k || ''].join('\t'));
  });
  return lines;
}
document.addEventListener('click', function(e){
  if(e.target.closest('[data-geoexp]')){
    var lines = geoExportText();
    document.getElementById('geo-text').value = lines.join('\n');
    document.getElementById('geo-modal-cnt').textContent = 'адресов: ' + lines.length + ' · ' + new Date().toISOString().slice(0,10);
    document.getElementById('geo-modal').hidden = false;
    return;
  }
  if(e.target.id === 'geo-close' || e.target.id === 'geo-modal') document.getElementById('geo-modal').hidden = true;
  if(e.target.id === 'geo-copy'){
    var ta = document.getElementById('geo-text'); ta.focus(); ta.select();
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(x){}
    if(!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value);
    e.target.textContent = 'Скопировано';
    setTimeout(function(){ e.target.textContent = 'Скопировать'; }, 1500);
  }
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') document.getElementById('geo-modal').hidden = true; });

function today(){ var d = new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function dayUsed(){
  try{ var o = JSON.parse(localStorage.getItem(GEO_DAY)) || {}; return o.d === today() ? (o.n||0) : 0; }catch(e){ return 0; }
}
function dayTake(){                              // резерв запроса до обращения к API
  var n = dayUsed();
  if(n >= GEO_LIMIT) return false;
  try{ localStorage.setItem(GEO_DAY, JSON.stringify({ d:today(), n:n+1 })); }catch(e){}
  return true;
}
function addrNoRegion(a){ return String(a||'').replace(/^\s*(обл\.?\s*московская|московская\s+обл(\.|асть)?)\s*,\s*/i, ''); }
function geoQuery(h){
  return 'Московская область, ' + h.okrug + (h.np ? ', ' + h.np : '') + ', ' + addrNoRegion(h.addr);
}
/* Координаты дома: сначала точный ключ, затем — по совпадению адреса в конце ключа
   (на случай, если в таблице поменялось написание населённого пункта или добавилось «обл. Московская»). */
function findGeo(h, cache){
  var k = norm(geoQuery(h));
  if(MANUAL_COORDS[k]) return { c:MANUAL_COORDS[k] };
  if(cache[k] && cache[k].c) return cache[k];
  var tail = ', ' + norm(addrNoRegion(h.addr)), head = 'московская область, ' + norm(h.okrug) + ', ';
  var keys = Object.keys(MANUAL_COORDS);
  for(var i=0;i<keys.length;i++) if(keys[i].indexOf(head) === 0 && keys[i].slice(-tail.length) === tail) return { c:MANUAL_COORDS[keys[i]] };
  keys = Object.keys(cache);
  for(var j=0;j<keys.length;j++){ var e = cache[keys[j]]; if(e && e.c && keys[j].indexOf(head) === 0 && keys[j].slice(-tail.length) === tail) return e; }
  return null;
}

function mapHouses(){
  var agg = {}, order = [];
  view.forEach(function(r){
    var id = houseOf(r);
    if(!agg[id]){
      agg[id] = { id:id, okrug:okrugName(r), np:cell(r,'np'), addr:cell(r,'addr'), disp:fmtAddr(cell(r,'addr'), okrugName(r)), cnt:0, area:0, res:0, rest:0 };
      order.push(id);
    }
    var h = agg[id];
    h.cnt++; h.area += areaOf(r);
    if(isResettled(r)) h.res++;
    if(isRemaining(r)) h.rest++;
  });
  return order.map(function(id){ return agg[id]; }).filter(function(h){ return h.addr; });
}

function balloon(h, red){
  return '<div style="font-family:IBM Plex Sans,sans-serif;font-size:13px;line-height:1.5;min-width:220px">' +
    '<b>'+esc(h.disp)+'</b><br><span style="color:#767d87">'+esc(h.okrug)+(h.np?' · '+esc(h.np):'')+'</span><br>' +
    'Ж/п: <b>'+fmtInt.format(h.cnt)+'</b> · площадь <b>'+fmtArea.format(h.area)+' м²</b><br>' +
    'Расселено: <b>'+fmtInt.format(h.res)+'</b> · подлежит расселению: <b>'+fmtInt.format(h.rest)+'</b>' +
    (red ? '<br><b style="color:#c0392b">В списке «До 30%»</b>' : '') + '</div>';
}

function drawMap(){
  var note = document.getElementById('map-note');
  if(typeof ymaps === 'undefined'){ note.textContent = 'Яндекс.Карты не загрузились: проверьте ключ и ограничение по домену'; return; }
  var gen = ++mapGen;
  ymaps.ready(function(){
    if(gen !== mapGen) return;
    if(!ymap){
      ymap = new ymaps.Map('map', { center:[55.75,37.62], zoom:8, controls:['zoomControl','typeSelector','fullscreenControl'] },
                          { suppressMapOpenBlock:true });
    }
    ymap.geoObjects.removeAll();
    /* Каждый дом — отдельный значок; наложившиеся на масштабе — кружок с числом. */
    /* Три слоя, каждый со своими кружками: дома «до 30%» не прячутся в кружки
       с обычными домами и ЖК и всегда рисуются поверх. */
    if(mainLayer) mainLayer.destroy();
    var cl = mainLayer = new OverlapLayer(ymap);
    var taken = {};

    /* Новостройки — зелёные многоэтажки, координаты из файла */
    var jkPms = JK_DATA.map(function(j){
      return new ymaps.Placemark([j[5], j[6]], { balloonContent:jkBalloon(j), hintContent:'ЖК «'+j[1]+'» · '+j[0], grp:'jk' }, JK_ICON);
    });
    cl.addAll(jkPms);                      // новостройки видны при любом фильтре

    /* Стрелки: клик по аварийному дому — стрелки до всех ЖК его округа с расстоянием по прямой */
    var arrows = new ymaps.GeoObjectCollection();
    ymap.geoObjects.add(arrows);
    var activeHouse = null;
    var DistLayout = ymaps.templateLayoutFactory.createClass('<div class="dist-label">$[properties.iconContent]</div>');
    function drawArrows(h, from){
      arrows.removeAll();
      if(activeHouse === h){ activeHouse = null; return; }
      activeHouse = h;
      var key = okrKey(h.okrug), pts = [from];
      JK_DATA.filter(function(j){ return okrKey(j[0]) === key; }).forEach(function(j){
        var to = [j[5], j[6]];
        var dist = ymaps.coordSystem.geo.getDistance(from, to);
        /* наконечник — значок постоянного размера на экране (18 px), повёрнутый вдоль линии;
           раньше это были два отрезка в градусах, и при приближении они вырастали до ~1 км */
        var ang = 0;
        try{
          var proj = ymap.options.get('projection'), a1 = proj.toGlobalPixels(from, 10), a2 = proj.toGlobalPixels(to, 10);
          ang = Math.atan2(a2[1]-a1[1], a2[0]-a1[0]);
        }catch(e){}
        var deg = ang * 180 / Math.PI;
        var headSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18">' +
          '<path d="M17 9 L2 2.5 L5.5 9 L2 15.5 Z" fill="#1e8a4c" stroke="#fff" stroke-width="1" stroke-linejoin="round" transform="rotate('+deg.toFixed(1)+' 9 9)"/></svg>';
        arrows.add(new ymaps.Polyline([from, to], {}, { strokeColor:'#1e8a4c', strokeWidth:3, strokeOpacity:.85 }));
        arrows.add(new ymaps.Placemark(to, {}, { iconLayout:'default#image',
          iconImageHref:'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(headSvg),
          iconImageSize:[18,18], iconImageOffset:[-9 - 8*Math.cos(ang), -9 - 8*Math.sin(ang)], zIndex:640, cursor:'default', hasHint:false, hasBalloon:false }));
        arrows.add(new ymaps.Placemark([(from[0]+to[0])/2, (from[1]+to[1])/2],
          { iconContent:fmtKm(dist), hintContent:'ЖК «'+j[1]+'»: '+fmtKm(dist)+' по прямой' },
          { iconLayout:DistLayout, iconShape:{ type:'Rectangle', coordinates:[[-30,-12],[30,12]] }, zIndex:800 }));
        pts.push(to);
      });
      if(pts.length > 1) try{ ymap.setBounds(ymaps.util.bounds.fromPoints(pts), { checkZoomRange:true, zoomMargin:60, duration:300 }); }catch(e){}
    }
    ymap.events.add('click', function(){ arrows.removeAll(); activeHouse = null; });

    /* Пятна застройки: квадраты и синие мерцающие значки */
    var spotCol = new ymaps.GeoObjectCollection();
    ymap.geoObjects.add(spotCol);
    var spotPts = SPOTS.map(function(){ return []; }), spotBounds = null;
    var SpotLayout = ymaps.templateLayoutFactory.createClass(
      '<div class="spot-ico"><img src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(HOUSE_SVG_BLUE) + '" alt=""></div>');
    function drawSpots(){
      spotCol.removeAll(); spotBounds = null;
      if(!spotsOn) return;
      var all = [];
      SPOTS.forEach(function(sp, i){
        var pts = spotPts[i]; if(!pts.length) return;
        var b = ymaps.util.bounds.fromPoints(pts);
        var cLat = (b[0][0]+b[1][0])/2, cLon = (b[0][1]+b[1][1])/2;
        var hM = (b[1][0]-b[0][0]) * 111320, wM = (b[1][1]-b[0][1]) * 111320 * Math.cos(cLat*Math.PI/180);
        var half = Math.max(hM, wM)/2 + 90;                 // квадрат с отступом 90 м
        var dLat = half/111320, dLon = half/(111320*Math.cos(cLat*Math.PI/180));
        var sq = [[cLat-dLat, cLon-dLon], [cLat+dLat, cLon+dLon]];
        spotCol.add(new ymaps.Rectangle(sq, { hintContent:'Пятно застройки: ' + sp.name + ' · домов: ' + pts.length },
          { fillColor:'#1e7bff22', strokeColor:'#1e7bff', strokeWidth:3, strokeStyle:'dash', zIndex:500 }));
        all.push(sq[0], sq[1]);
      });
      if(all.length) spotBounds = ymaps.util.bounds.fromPoints(all);
    }

    var houses = mapHouses().filter(function(h){
      if(!mapFilter) return true;
      if(mapFilter === 'jk') return false;
      return mapFilter === 'red' ? isDo30(h) : !isDo30(h);
    }), cache = geoCache(), now = Date.now(), queue = [], shown = 0, redCnt = 0;
    function put(h, c){
      /* Дома с одинаковыми координатами разводятся по кругу, чтобы не закрывали друг друга. */
      var key = c[0].toFixed(5)+','+c[1].toFixed(5), k = taken[key] || 0;
      taken[key] = k + 1;
      var p = c;
      if(k){ var a = k * 2.4, d = 0.00018 * Math.sqrt(k); p = [c[0] + d*Math.cos(a), c[1] + d*1.7*Math.sin(a)]; }
      var red = isDo30(h);
      if(red) redCnt++;
      var si = spotOf(h);
      var icon = red ? HOUSE_ICON_RED : HOUSE_ICON;
      if(si >= 0){
        spotPts[si].push(p);
        if(spotsOn) icon = { iconLayout:SpotLayout, iconShape:{ type:'Rectangle', coordinates:[[-15,-26],[15,4]] },
                             zIndex:760, hideIconOnBalloonOpen:false, balloonOffset:[0,-28] };
      }
      var pm = new ymaps.Placemark(p, { balloonContent:balloon(h, red) + (si >= 0 ? '<div style="font-family:IBM Plex Sans,sans-serif;font-size:12px;color:#1e7bff;font-weight:600;margin-top:4px">Пятно застройки: '+esc(SPOTS[si].name)+'</div>' : ''),
        hintContent:h.disp + ' · ' + h.cnt + ' ж/п', grp: red ? 'red' : 'house' }, icon);
      pm.events.add('click', function(){ drawArrows(h, p); });
      cl.add(pm);
      shown++;
    }
    houses.forEach(function(h){
      var e = findGeo(h, cache);
      if(e && e.c && (!e.t || now - e.t < GEO_TTL)) put(h, e.c); else queue.push(h);
    });
    function fit(){
      drawSpots();
      if(spotsOn && spotBounds){ try{ ymap.setBounds(spotBounds, { checkZoomRange:true, zoomMargin:60 }); }catch(e){} return; }
      var isJk = function(p){ return p.properties.get('grp') === 'jk'; };
      if(mapFilter === 'jk'){ try{ ymap.setBounds(cl.getBounds(isJk), { checkZoomRange:true, zoomMargin:40 }); }catch(e){} return; }
      if(shown) try{
        var bb = cl.getBounds(function(p){ return !isJk(p); });
        if(bb) ymap.setBounds(bb, { checkZoomRange:true, zoomMargin:40 });
      }catch(e){}
    }
    function status(extra){
      if(mapFilter === 'jk'){ note.textContent = 'Новостроек на карте: ' + fmtInt.format(JK_DATA.length); return; }
      note.textContent = 'На карте ' + fmtInt.format(shown) + ' из ' + fmtInt.format(houses.length) + ' домов · до 30%: ' + fmtInt.format(redCnt) + (extra ? ' · ' + extra : '');
    }
    fit(); status(queue.length ? 'поиск адресов: ' + queue.length : '');

    var miss = 0;
    (function next(){
      if(gen !== mapGen) return;
      if(!queue.length){ fit(); status(miss ? 'не найдено: ' + miss : ''); return; }
      if(!dayTake()){ fit(); status('суточный лимит геокодера исчерпан, остальные дома появятся завтра'); return; }
      var h = queue.shift();
      ymaps.geocode(geoQuery(h), { results:1, boundedBy:MO_BOUNDS, strictBounds:true }).then(function(res){
        var g = res.geoObjects.get(0);
        if(g){
          var c = g.geometry.getCoordinates(), cc = geoCache();
          cc[norm(geoQuery(h))] = { c:c, t:Date.now(),
            p:g.properties.get('metaDataProperty.GeocoderMetaData.precision') || '',
            k:g.properties.get('metaDataProperty.GeocoderMetaData.kind') || '' }; geoSave(cc);
          if(gen === mapGen) put(h, c);
        } else miss++;
        status('поиск адресов: ' + queue.length);
        setTimeout(next, 120);
      }, function(){ miss++; setTimeout(next, 300); });
    })();
  });
}

function switchTo(name){
  tab = name;
  document.getElementById('view-main').hidden = name !== 'main';
  document.getElementById('view-map').hidden = name !== 'map';
  document.getElementById('view-do30').hidden = name !== 'do30';
  document.getElementById('nav-map').setAttribute('aria-pressed', name === 'map' ? 'true' : 'false');
  document.getElementById('nav-do30').setAttribute('aria-pressed', name === 'do30' ? 'true' : 'false');
  window.scrollTo({ top:0, behavior:'auto' });
  if(name === 'map' && rows.length){ drawMap(); if(ymap) setTimeout(function(){ ymap.container.fitToViewport(); }, 50); }
  if(name === 'do30'){ drawDo30(); if(ymap30) setTimeout(function(){ ymap30.container.fitToViewport(); }, 50); }
}
document.getElementById('nav-do30').addEventListener('click', function(){ switchTo(tab === 'do30' ? 'main' : 'do30'); });

/* ═══ 9. Вкладка «До 30%»: все дома из файла «До 30%.xlsx» ═════════
   Не зависит от таблицы дашборда. Координаты — тот же геокодер, кэш
   и суточный лимит, что у вкладки «Карта».                            */
var ymap30 = null, map30Gen = 0;
function balloon30(d, cat){
  var pct = Math.round(d[5]*1000)/10;
  return '<div style="font-family:IBM Plex Sans,sans-serif;font-size:13px;line-height:1.5;min-width:240px">' +
    '<b>'+esc(fmtAddr(d[0]))+'</b><br>' +
    'Подлежит расселению: <b>'+fmtInt.format(d[1])+'</b><br>' +
    'Расселено: <b>'+fmtInt.format(d[2])+'</b><br>' +
    (d[3] ? 'Розыск собственника: <b>'+fmtInt.format(d[3])+'</b><br>' : '') +
    'Общий итог: <b>'+fmtInt.format(d[4])+'</b><br>' +
    'Остаток: <b style="color:#c0392b">'+String(pct).replace('.',',')+'%</b>' +
    (cat ? '<br><span style="color:#767d87">Точка на карте: '+GEO_CATS[cat].label.toLowerCase()+'</span>' : '') + '</div>';
}
/* Точность геокодера Яндекса (metaDataProperty.GeocoderMetaData):
   precision exact — дом найден точно; number / near / range — дом найден приблизительно;
   street — только улица; other — по kind: locality — населённый пункт,
   district — микрорайон / район города, area / province — район / область. */
var GEO_CATS = {
  house:    { label:'Точно до дома',             color:'#0e7361' },
  manual:   { label:'Уточнено вручную',          color:'#1b4d8f' },
  approx:   { label:'До дома приблизительно',    color:'#4f8a74' },
  street:   { label:'До улицы',                  color:'#a96a15' },
  district: { label:'До микрорайона',            color:'#c98a2b' },
  locality: { label:'До населённого пункта',     color:'#c0392b' },
  region:   { label:'До района или области',     color:'#7d1f16' },
  other:    { label:'Прочее',                    color:'#767d87' },
  miss:     { label:'Не найдено',                color:'#0f1317' },
  pending:  { label:'Ищется',                    color:'#c9ccd1' }
};
function geoCat(prec, kind){
  if(prec === 'exact') return 'house';
  if(prec === 'number' || prec === 'near' || prec === 'range') return 'approx';
  if(prec === 'street') return 'street';
  if(kind === 'locality') return 'locality';
  if(kind === 'district') return 'district';
  if(kind === 'area' || kind === 'province' || kind === 'country') return 'region';
  return 'other';
}

var houses30 = null, sel30 = null;

/* Сводка: кнопки по точности. Клик — на карте и в списке только эти дома. */
function renderSum30(){
  if(!document.getElementById('map30-sum')) return;   // сводка по точности убрана с вкладки
  var cnt = {}; Object.keys(GEO_CATS).forEach(function(k){ cnt[k] = 0; });
  houses30.forEach(function(h){ cnt[h.cat]++; });
  document.getElementById('map30-sum').innerHTML = Object.keys(GEO_CATS).filter(function(k){ return cnt[k] > 0; })
    .map(function(k){
      return '<button class="geo-chip" type="button" data-gcat="'+k+'" aria-pressed="'+(sel30===k)+'">' +
        '<i style="background:'+GEO_CATS[k].color+'"></i>'+GEO_CATS[k].label+' <b>'+fmtInt.format(cnt[k])+'</b></button>';
    }).join('');
}
function renderList30(){
  var order = Object.keys(GEO_CATS);
  var list = houses30.filter(function(h){ return !sel30 || h.cat === sel30; }).slice()
    .sort(function(a,b){ return (order.indexOf(a.cat)-order.indexOf(b.cat)) || (a.i-b.i); });
  document.getElementById('list30-title').textContent = sel30 ? 'Список домов: ' + GEO_CATS[sel30].label.toLowerCase() : 'Список домов';
  document.getElementById('list30-cnt').textContent = fmtInt.format(list.length);
  document.getElementById('list30').innerHTML = list.map(function(h, n){
    var d = h.d, pct = String(Math.round(d[5]*1000)/10).replace('.',',');
    return '<button class="item" type="button" data-gi="'+h.i+'"'+(h.pm ? '' : ' title="Нет точки на карте"')+'>' +
      '<span class="item-rank num">'+(n+1)+'</span>' +
      '<span class="item-name wrap">'+esc(fmtAddr(d[0]))+'</span>' +
      '<span class="item-cat"><i style="background:'+GEO_CATS[h.cat].color+'"></i>'+GEO_CATS[h.cat].label+'</span>' +
      '<span class="item-cnt num" style="font-size:13px">'+pct+'%</span></button>';
  }).join('');
}
var clu30 = null;
function apply30(){
  /* фильтр по точности: в кластер попадают только видимые дома, чтобы число в кружке было верным */
  if(clu30){
    clu30.items = houses30.filter(function(h){ return h.pm && (!sel30 || h.cat === sel30); }).map(function(h){ return h.pm; });
    clu30.schedule();
  }
  renderSum30(); renderList30();
}
(document.getElementById('map30-sum') || document.createElement('div')).addEventListener('click', function(e){
  var b = e.target.closest('[data-gcat]'); if(!b || !houses30) return;
  var k = b.getAttribute('data-gcat');
  sel30 = (sel30 === k) ? null : k;
  apply30();
});
document.getElementById('list30').addEventListener('click', function(e){
  var b = e.target.closest('[data-gi]'); if(!b || !houses30) return;
  var h = houses30[+b.getAttribute('data-gi')];
  if(!h || !h.pm || !ymap30) return;
  document.getElementById('map30').scrollIntoView({ behavior:'smooth', block:'center' });
  ymap30.setCenter(h.pm.geometry.getCoordinates(), 16, { duration:300 });
  setTimeout(function(){
    /* дом может оказаться внутри кружка с числом — тогда открываем его в балуне кластера */
    var cp = clu30 && clu30.clusterOf(h.pm);
    if(cp) cp.balloon.open(); else h.pm.balloon.open();
  }, 400);
});

function drawDo30(){
  var note = document.getElementById('map30-note');
  if(typeof ymaps === 'undefined'){ note.textContent = 'Яндекс.Карты не загрузились: проверьте ключ и ограничение по домену'; return; }
  var gen = ++map30Gen;
  houses30 = DO30_DATA.map(function(d, i){ return { d:d, i:i, cat:'pending', pm:null }; });
  apply30();
  ymaps.ready(function(){
    if(gen !== map30Gen) return;
    if(!ymap30){
      ymap30 = new ymaps.Map('map30', { center:[55.75,37.62], zoom:8, controls:['zoomControl','typeSelector','fullscreenControl'] },
                             { suppressMapOpenBlock:true });
    }
    ymap30.geoObjects.removeAll();
    if(clu30) clu30.destroy();
    var col = clu30 = new OverlapLayer(ymap30);
    var cache = geoCache(), now = Date.now(), queue = [], shown = 0, taken = {};

    function put(h, c, cat){
      var key = c[0].toFixed(5)+','+c[1].toFixed(5), k = taken[key] || 0;
      taken[key] = k + 1;
      var p = c, d = h.d;
      if(k){ var a = k * 2.4, dd = 0.00018 * Math.sqrt(k); p = [c[0] + dd*Math.cos(a), c[1] + dd*1.7*Math.sin(a)]; }
      h.cat = cat;
      h.pm = new ymaps.Placemark(p, { balloonContent:balloon30(d, cat),
        hintContent:fmtAddr(d[0]) + ' · остаток ' + Math.round(d[5]*100) + '%', grp:'red' }, HOUSE_ICON_RED);
      if(!sel30 || sel30 === cat) col.add(h.pm);
      shown++;
    }
    function fit(){ if(shown) try{ ymap30.setBounds(col.getBounds(), { checkZoomRange:true, zoomMargin:40 }); }catch(e){} }
    function status(extra){
      note.textContent = 'На карте ' + fmtInt.format(shown) + ' из ' + fmtInt.format(DO30_DATA.length) + ' домов' + (extra ? ' · ' + extra : '');
    }
    /* Из кэша берутся записи с сохранённой точностью; старые записи без неё запрашиваются заново. */
    houses30.forEach(function(h){
      var m = MANUAL_COORDS[norm(h.d[0])];
      if(m){ put(h, m, 'manual'); return; }
      var e = cache[norm(h.d[0])];
      if(e && now - e.t < GEO_TTL && e.miss){ h.cat = 'miss'; return; }
      if(e && e.c && e.p && now - e.t < GEO_TTL) put(h, e.c, geoCat(e.p, e.k)); else queue.push(h);
    });
    apply30(); fit(); status(queue.length ? 'поиск адресов: ' + queue.length : '');
    (function next(){
      if(gen !== map30Gen) return;
      if(!queue.length){ fit(); status(''); return; }
      if(!dayTake()){ fit(); status('суточный лимит геокодера исчерпан, остальные дома появятся завтра'); return; }
      var h = queue.shift();
      ymaps.geocode(h.d[0], { results:1, boundedBy:MO_BOUNDS, strictBounds:true }).then(function(res){
        var g = res.geoObjects.get(0), cc = geoCache();
        if(g){
          var c = g.geometry.getCoordinates();
          var prec = g.properties.get('metaDataProperty.GeocoderMetaData.precision') || 'other';
          var kind = g.properties.get('metaDataProperty.GeocoderMetaData.kind') || '';
          cc[norm(h.d[0])] = { c:c, t:Date.now(), p:prec, k:kind }; geoSave(cc);
          if(gen === map30Gen) put(h, c, geoCat(prec, kind));
        } else {
          cc[norm(h.d[0])] = { miss:true, t:Date.now() }; geoSave(cc);
          h.cat = 'miss';
        }
        if(gen === map30Gen) apply30();
        status('поиск адресов: ' + queue.length);
        setTimeout(next, 120);
      }, function(){ h.cat = 'miss'; if(gen === map30Gen) apply30(); setTimeout(next, 300); });
    })();
  });
}
var mapBtns = document.querySelectorAll('[data-mapf]');
for(var mb=0;mb<mapBtns.length;mb++){
  mapBtns[mb].addEventListener('click', function(){
    var f = this.getAttribute('data-mapf');
    mapFilter = (mapFilter === f) ? null : f;
    for(var q=0;q<mapBtns.length;q++) mapBtns[q].setAttribute('aria-pressed', mapBtns[q].getAttribute('data-mapf') === mapFilter ? 'true' : 'false');
    if(rows.length) drawMap();
  });
}
document.getElementById('btn-spots').addEventListener('click', function(){
  spotsOn = !spotsOn;
  this.setAttribute('aria-pressed', spotsOn ? 'true' : 'false');
  if(rows.length) drawMap();
});
document.getElementById('nav-map').addEventListener('click', function(){ switchTo(tab === 'map' ? 'main' : 'map'); });

load();
})();
</script>
